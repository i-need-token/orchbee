[workspace]
resolver = "3"
exclude = ["third-party/process-wrap"]
members = [
	"apps/orchbee",
	"apps/orchbee-server",
	"apps/orchbee-worker",
	"apps/*/crates/*",
	"crates/agent-integration",
	"crates/agent-integration-writer",
	"crates/agent-observation-protocol",
	"crates/capability-node-protocol",
	"crates/client-server-protocol",
	"crates/local-client-protocol",
	"crates/local-ipc",
	"crates/local-peer-credentials",
	"crates/local-worker-protocol",
	"crates/local-runtime",
	"crates/terminal-protocol",
	"crates/windows-console-host",
	"crates/workbench-protocol",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.0"

[patch.crates-io]
process-wrap = { path = "third-party/process-wrap" }

[workspace.dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
crossterm = { version = "0.29.0", default-features = false }
getrandom = { version = "0.3.4", default-features = false }
jsonschema = { version = "0.53.0", default-features = false }
nix = { version = "0.31.3", default-features = false }
process-wrap = { version = "10.0.1", default-features = false, features = [
	"std",
	"job-object",
	"creation-flags",
] }
ratatui = { version = "0.30.2", default-features = false, features = [
	"std",
	"unstable-rendered-line-info",
] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode", "perf"] }
rustix = { version = "1.1.4", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }
unicode-segmentation = { version = "1.13.3", default-features = false }
win32console = { version = "0.1.5", default-features = false }
winapi-util = { version = "0.1.11", default-features = false }
windows = { version = "0.62.2", default-features = false, features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_Console",
	"Win32_System_Threading",
] }
winsafe = { version = "0.0.29", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
wildcard_imports = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.sha2]
opt-level = 3
