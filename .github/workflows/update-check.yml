name: Update check

# Runs when the release workflow's publication job dispatches it with the tag it published (a
# release published with that job's token raises no `release: published`), when a release is
# published by hand, or by hand with a published tag, and proves on a fresh runner of each platform
# whose release builds update themselves (Windows and both macOS rows; Linux withholds `update`)
# that the version people have now updates to the new release through its own `orchbee update`
# over HTTPS, reading the release's feed asset of that platform. The owner moves the update channel
# with `pnpm website:release` only after every row passes. Every request is an anonymous GET to the
# public release: no secret, no environment, read-only permissions.
# Contract: docs/VERIFICATION.md#update-check-workflow; the owner's steps: docs/RELEASING.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: A published release tag, such as v0.1.0-beta.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-check-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  update-check:
    name: Update check ${{ github.event.release.tag_name || inputs.tag }} ${{ matrix.platform }}
    strategy:
      fail-fast: false
      # The runners release.yml builds each row on.
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # A release run checks out the tagged commit, a manual run the chosen branch; either way the
      # tracked update pair there names the version people have now.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update the version people have now to the release
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/release-smoke-windows.mjs update "$env:RELEASE_TAG" --release "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/" --work "$env:RUNNER_TEMP\update-check"

      - name: Update the version people have now to the release
        if: runner.os == 'macOS'
        shell: bash
        run: node scripts/release-smoke-macos.mjs update "$RELEASE_TAG" --release "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" --work "$RUNNER_TEMP/update-check"
