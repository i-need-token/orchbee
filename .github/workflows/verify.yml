name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    if: github.ref_name != 'ci/input-stall'
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal --component clippy,rustfmt
          rustc --version
          cargo --version

      - name: Set up Zig
        env:
          ORCHBEE_ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          ORCHBEE_ZIG_URL: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
        run: |
          curl --fail --location --silent --show-error "$ORCHBEE_ZIG_URL" --output "$RUNNER_TEMP/orchbee-zig.tar.xz"
          echo "$ORCHBEE_ZIG_SHA256  $RUNNER_TEMP/orchbee-zig.tar.xz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/orchbee-zig"
          tar -xJf "$RUNNER_TEMP/orchbee-zig.tar.xz" --strip-components=1 --directory "$RUNNER_TEMP/orchbee-zig"
          echo "$RUNNER_TEMP/orchbee-zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/orchbee-zig/zig" version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Verify repository
        run: pnpm verify --verbose

      - name: Verify generated state is committed
        run: git diff --exit-code

  tla:
    name: Change-triggered TLA+
    if: github.ref_name != 'ci/input-stall'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select affected TLA+ models
        id: select
        env:
          TLA_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/tla/select-changed-models.mjs "$TLA_BASE"

      - name: Set up Java
        if: steps.select.outputs.count != '0'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check affected TLA+ models
        if: steps.select.outputs.count != '0'
        run: node scripts/tla/run-models.mjs --models "${{ steps.select.outputs.model_ids }}"

      - name: Check real TLC cache boundaries
        if: steps.select.outputs.count != '0'
        run: node --test scripts/tla/model-cache-cli.test.mjs scripts/tla/model-mutations.test.mjs

  rust-windows:
    name: Rust native (windows-latest)
    if: github.ref_name != 'ci/input-stall'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install --profile minimal --component clippy,rustfmt
          rustc --version
          cargo --version

      - name: Set up Zig
        shell: pwsh
        run: |
          $zigUrl = 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip'
          $zigSha256 = '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e'
          $archive = Join-Path $env:RUNNER_TEMP 'orchbee-zig.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'orchbee-zig'
          curl.exe --fail --location --silent --show-error $zigUrl --output $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $zigSha256) { throw "Unexpected Zig archive digest: $actual" }
          Expand-Archive -Path $archive -DestinationPath $destination
          $zigDirectory = (Get-ChildItem -Path $destination -Directory | Select-Object -First 1).FullName
          $zigDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $zigDirectory 'zig.exe') version

      # Zig's own download of this transitive Terminal Host dependency (Ghostty's translate_c -> arocc)
      # fails on GitHub's Windows runners with HttpConnectionClosing. curl fetches it, and `zig fetch`
      # admits it only under the content hash translate_c pins. The release workflow carries the same
      # step: drop both once Zig fetches it, or update both when the Ghostty pin moves translate_c.
      - name: Prefetch the arocc Zig package
        shell: pwsh
        working-directory: apps/terminal-host
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'arocc.tar.gz'
          curl.exe --fail --location --silent --show-error 'https://github.com/vancluever/arocc/archive/ecbc5c799574e0da2758a961b12efa586007f03c.tar.gz' --output $archive
          $hash = zig fetch $archive
          if ($hash -ne 'aro-0.0.0-JSD1Qk8rOQDnuVcD4jAwMpHitA6pADRKzQ7M7hKRwxvD') { throw "Unexpected arocc package hash: $hash" }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the Rust workspace natively
        run: pnpm verify:rust-native --verbose

  terminal-host-native:
    name: Terminal Host native (${{ matrix.os }})
    if: github.ref_name != 'ci/input-stall'
    strategy:
      fail-fast: false
      matrix:
        # GitHub rejects the macOS runner label while this repository is private. Once it is
        # public, restore the macOS job by setting the next line to: os: [macos-14, windows-latest]
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Zig on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64)
              zig_url="https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz"
              zig_sha256="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
              ;;
            x86_64)
              zig_url="https://ziglang.org/download/0.16.0/zig-x86_64-macos-0.16.0.tar.xz"
              zig_sha256="0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7"
              ;;
            *)
              exit 1
              ;;
          esac
          curl --fail --location --silent --show-error "$zig_url" --output "$RUNNER_TEMP/orchbee-zig.tar.xz"
          echo "$zig_sha256  $RUNNER_TEMP/orchbee-zig.tar.xz" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/orchbee-zig"
          tar -xJf "$RUNNER_TEMP/orchbee-zig.tar.xz" --strip-components=1 --directory "$RUNNER_TEMP/orchbee-zig"
          echo "$RUNNER_TEMP/orchbee-zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/orchbee-zig/zig" version

      - name: Set up Zig on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zigUrl = 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip'
          $zigSha256 = '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e'
          $archive = Join-Path $env:RUNNER_TEMP 'orchbee-zig.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'orchbee-zig'
          curl.exe --fail --location --silent --show-error $zigUrl --output $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $zigSha256) { throw "Unexpected Zig archive digest: $actual" }
          Expand-Archive -Path $archive -DestinationPath $destination
          $zigDirectory = (Get-ChildItem -Path $destination -Directory | Select-Object -First 1).FullName
          $zigDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $zigDirectory 'zig.exe') version

      # Zig's own download of this transitive Terminal Host dependency (Ghostty's translate_c -> arocc)
      # fails on GitHub's Windows runners with HttpConnectionClosing. curl fetches it, and `zig fetch`
      # admits it only under the content hash translate_c pins. The release workflow carries the same
      # step: drop both once Zig fetches it, or update both when the Ghostty pin moves translate_c.
      - name: Prefetch the arocc Zig package
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/terminal-host
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'arocc.tar.gz'
          curl.exe --fail --location --silent --show-error 'https://github.com/vancluever/arocc/archive/ecbc5c799574e0da2758a961b12efa586007f03c.tar.gz' --output $archive
          $hash = zig fetch $archive
          if ($hash -ne 'aro-0.0.0-JSD1Qk8rOQDnuVcD4jAwMpHitA6pADRKzQ7M7hKRwxvD') { throw "Unexpected arocc package hash: $hash" }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native Terminal Host
        run: pnpm --filter @orchbee/terminal-host test

      - name: Check native Terminal Host formatting
        run: pnpm --filter @orchbee/terminal-host format:check

  # TEMPORARY (input-stall investigation): repeats the stalling Windows process target on several
  # runners and prints each failed attempt's report. Remove before merging.
  input-stall:
    name: Input stall repeat (${{ matrix.runner }}, ${{ matrix.console }})
    if: github.ref_name == 'ci/input-stall'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: 1, console: system }
          - { runner: 2, console: system }
          - { runner: 3, console: openconsole }
          - { runner: 4, console: openconsole }
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install --profile minimal --component clippy,rustfmt
          rustc --version

      - name: Set up Zig
        shell: pwsh
        run: |
          $zigUrl = 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip'
          $zigSha256 = '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e'
          $archive = Join-Path $env:RUNNER_TEMP 'orchbee-zig.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'orchbee-zig'
          curl.exe --fail --location --silent --show-error $zigUrl --output $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $zigSha256) { throw "Unexpected Zig archive digest: $actual" }
          Expand-Archive -Path $archive -DestinationPath $destination
          $zigDirectory = (Get-ChildItem -Path $destination -Directory | Select-Object -First 1).FullName
          $zigDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prefetch the arocc Zig package
        shell: pwsh
        working-directory: apps/terminal-host
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'arocc.tar.gz'
          curl.exe --fail --location --silent --show-error 'https://github.com/vancluever/arocc/archive/ecbc5c799574e0da2758a961b12efa586007f03c.tar.gz' --output $archive
          $hash = zig fetch $archive
          if ($hash -ne 'aro-0.0.0-JSD1Qk8rOQDnuVcD4jAwMpHitA6pADRKzQ7M7hKRwxvD') { throw "Unexpected arocc package hash: $hash" }

      - name: Stage the product's ConPTY
        if: matrix.console == 'openconsole'
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'conpty'
          node apps/terminal-host/scripts/windows-conpty.mjs --output $bundle
          if ($LASTEXITCODE -ne 0) { throw 'ConPTY staging failed' }
          "ORCHBEE_TEST_CONPTY_DIR=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the peers and the test target
        shell: pwsh
        run: |
          cargo build --package orchbee-server --package orchbee-worker --bins --all-features --locked
          if ($LASTEXITCODE -ne 0) { throw 'peer build failed' }
          cargo test --package orchbee --all-features --locked --test cli_windows_idle_close --no-run
          if ($LASTEXITCODE -ne 0) { throw 'test build failed' }

      - name: Repeat the target
        shell: pwsh
        working-directory: apps/orchbee
        run: |
          $exe = Get-ChildItem ..\..\target\debug\deps\cli_windows_idle_close-*.exe | Sort-Object LastWriteTime | Select-Object -Last 1
          $logs = Join-Path $env:RUNNER_TEMP 'stall-logs'
          New-Item -ItemType Directory -Force $logs | Out-Null
          # Warm the Host build the fixtures share, one test alone.
          $env:RUST_TEST_THREADS = '1'
          & $exe.FullName the_panel_route_and_hidden_presentations_decide_from_the_real_facts --exact *> (Join-Path $logs 'warm.log')
          Remove-Item Env:RUST_TEST_THREADS
          $failed = @()
          for ($i = 1; $i -le 10; $i++) {
            $log = Join-Path $logs "attempt-$i.log"
            $started = Get-Date
            & $exe.FullName *> $log
            $code = $LASTEXITCODE
            $summary = Select-String -Path $log -Pattern '^test result:' | Select-Object -Last 1
            "attempt $i exit $code after $([int]((Get-Date) - $started).TotalSeconds) s: $($summary.Line)"
            if ($code -ne 0) { $failed += $log }
          }
          foreach ($log in $failed) {
            "::group::$(Split-Path $log -Leaf)"
            Get-Content $log | Where-Object { $_ -notmatch '^\s*\S?\s*│\s*$' -and $_ -notmatch '^Failed TUI screen:' }
            '::endgroup::'
          }
          "failed attempts: $($failed.Count) of 10"
          if ($failed.Count -gt 0) { exit 1 }
