name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # A push to main waits for the run in progress instead of cancelling it: a complete run outlasts
  # the gap between pushes, and a cancelled run reports nothing. GitHub keeps one waiting run per
  # group, so the newest commit is verified next.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal --component clippy,rustfmt
          rustc --version
          cargo --version

      # Third-party crates only; see docs/VERIFICATION.md#ci-contract.
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: verify-lint
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install --yes zsh

      # Every stage of `pnpm verify` except the Cargo test suites: Linux is not a release platform
      # yet and several of its Cargo test targets fail, which made every run red. The Windows job
      # below runs those suites. Restore `pnpm verify` here when Linux support resumes.
      - name: Verify repository
        run: pnpm verify:no-rust-tests --verbose

      - name: Verify generated state is committed
        run: git diff --exit-code

  rust-windows:
    name: Rust native (windows-latest, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        # `pnpm verify:rust-native` as its three test parts, side by side: one job ran for an hour,
        # most of it in the terminal client's process tests. scripts/run-rust-workspace.mjs defines
        # the parts; together they run every target once.
        part: [workspace, client, client-commands]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install --profile minimal --component clippy,rustfmt
          rustc --version
          cargo --version

      # Third-party crates only. The two client parts build one package and share an entry, which
      # the client part saves; see docs/VERIFICATION.md#ci-contract.
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-native-${{ matrix.part == 'workspace' && 'workspace' || 'client' }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.part != 'client-commands' }}

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Restore the Terminal Host build cache
        uses: ./.github/actions/terminal-host-build-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the Rust workspace natively
        run: pnpm verify:rust-native --part ${{ matrix.part }} --verbose

      # Every part builds the same Host; the workspace part keeps it for later runs on main.
      - name: Save the Terminal Host build cache
        if: ${{ github.ref == 'refs/heads/main' && matrix.part == 'workspace' && !cancelled() }}
        uses: ./.github/actions/terminal-host-build-cache
        with:
          save: 'true'

  rust-macos:
    name: Rust native (macos-15, ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        # The same test parts as `rust-windows`. The native Terminal Host tests share the shortest
        # part's job, so a run needs three macOS runners rather than four (docs/VERIFICATION.md).
        include:
          - part: workspace
            label: workspace
          - part: client
            label: client
          - part: client-commands
            label: client-commands, Terminal Host
            host: true
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install --profile minimal --component clippy,rustfmt
          rustc --version
          cargo --version

      # Third-party crates only. The two client parts build one package and share an entry, which
      # the client part saves; see docs/VERIFICATION.md#ci-contract.
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-native-${{ matrix.part == 'workspace' && 'workspace' || 'client' }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.part != 'client-commands' }}

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Restore the Terminal Host build cache
        uses: ./.github/actions/terminal-host-build-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the Rust workspace natively
        run: pnpm verify:rust-native --part ${{ matrix.part }} --verbose

      # Every part builds the same Host; the workspace part keeps it for later runs on main.
      - name: Save the Terminal Host build cache
        if: ${{ github.ref == 'refs/heads/main' && matrix.part == 'workspace' && !cancelled() }}
        uses: ./.github/actions/terminal-host-build-cache
        with:
          save: 'true'

      # Runs after a red Rust part too, so a run reports both.
      - name: Test native Terminal Host
        if: ${{ matrix.host && !cancelled() }}
        run: pnpm --filter @orchbee/terminal-host test

      - name: Check native Terminal Host formatting
        if: ${{ matrix.host && !cancelled() }}
        run: pnpm --filter @orchbee/terminal-host format:check

  terminal-host-native:
    name: Terminal Host native (windows-latest)
    # macOS runs these steps in the `rust-macos` client-commands job.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native Terminal Host
        run: pnpm --filter @orchbee/terminal-host test

      - name: Check native Terminal Host formatting
        run: pnpm --filter @orchbee/terminal-host format:check

  # GitHub cancels a macOS job that no runner took within 15 minutes and reports the run as failed,
  # although no check ran. When that is the only thing not green, the run ends cancelled instead, so
  # a failed run always names a check that failed. A real failure or a job that ran out of time
  # leaves the run as it is.
  macos-runner-shortage:
    name: Report a missing macOS runner
    needs: [verify, rust-windows, rust-macos, terminal-host-native]
    if: ${{ !cancelled() && needs.rust-macos.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: End the run as cancelled when only an unassigned macOS job is not green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq "[.jobs[] | select(.status == \"completed\") | select($1)] | length"
          }
          unassigned='(.conclusion == "cancelled" and (.steps | length) == 0 and (.name | startswith("Rust native (macos-15")))'
          without_runner="$(count "$unassigned")"
          not_green="$(count "(.conclusion != \"success\" and .conclusion != \"skipped\") and ($unassigned | not)")"
          echo "macOS jobs without a runner: $without_runner; other jobs not green: $not_green"
          if [ "$without_runner" -eq 0 ] || [ "$not_green" -ne 0 ]; then
            exit 0
          fi
          echo "::notice title=No macOS runner::GitHub assigned no runner to $without_runner macOS job(s), so nothing ran there. Every other job passed; this run ends cancelled, not failed."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          # The cancellation ends this job; a run that GitHub does not cancel stays as it was.
          sleep 120
