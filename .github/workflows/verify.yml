name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # A push to main waits for the run in progress instead of cancelling it: a complete run outlasts
  # the gap between pushes, and a cancelled run reports nothing. GitHub keeps one waiting run per
  # group, so the newest commit is verified next.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which native jobs a change can affect, with the affected-verification plan against the
  # last verified commit; docs/VERIFICATION.md#ci-contract gives the rules. The Linux `verify` job
  # always runs.
  scope:
    name: Select native jobs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      terminal-host: ${{ steps.plan.outputs.terminal-host }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The plan reads the Cargo workspace graph.
      - name: Set up Rust
        run: rustup toolchain install --profile minimal

      # A pull request is compared with the base its merge commit was made on. A push to `main` is
      # compared with the newest commit before it whose Verify run passed, so commits whose run
      # failed or never finished stay in the comparison. A manual run, a re-run of a passed run,
      # or no such commit among the last 50 passed runs runs every job.
      - name: Find the last verified commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then
            base="$(git rev-parse HEAD^1)"
          elif [ "$EVENT" = push ]; then
            passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?branch=main&status=success&per_page=50" \
              --jq ".workflow_runs[] | select(.event == \"push\" or .event == \"workflow_dispatch\") | select(.id != $GITHUB_RUN_ID) | .head_sha")"
            for commit in $passed; do
              if git merge-base --is-ancestor "$commit" HEAD 2> /dev/null; then
                base="$commit"
                break
              fi
            done
          fi
          echo "Last verified commit: ${base:-none, so every job runs}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      # The Rust parts run for a selected Cargo member, which the Terminal Host's own changes select
      # through the process cohort; the Windows Terminal Host job for the Host. A root tooling input
      # runs both, and a plan that falls back to the complete gate runs everything.
      - name: Plan the native jobs
        id: plan
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          if [ -z "$BASE" ]; then
            rust=true
            host=true
          else
            plan="$(node scripts/run-checks.mjs verify --changed-since "$BASE" --plan | sed -n 's/^VERIFY_PLAN //p')"
            if [ -z "$plan" ]; then echo "The plan printed no VERIFY_PLAN line" >&2; exit 1; fi
            echo "$plan" | jq '{base, changedPathCount, mode, cargo, pnpm, rootTooling, reasons}'
            rust="$(echo "$plan" | jq '.all or .rootTooling or (.cargo | length > 0)')"
            host="$(echo "$plan" | jq '.all or .rootTooling or (.pnpm | any(. == "@orchbee/terminal-host"))')"
          fi
          echo "Rust parts: $rust; Windows Terminal Host: $host"
          {
            echo "rust=$rust"
            echo "terminal-host=$host"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Native jobs"
            echo
            echo "- Compared with: ${BASE:-nothing, so every job runs}"
            echo "- Rust parts on Linux, Windows and macOS: $rust"
            echo "- Terminal Host on Windows: $host"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal --component clippy,rustfmt
          rustc --version
          cargo --version

      # Third-party crates only; see docs/VERIFICATION.md#ci-contract.
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: verify-lint
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install --yes zsh

      # Every stage of `pnpm verify` except the Cargo test suites, which the native jobs below run
      # on Linux, Windows and macOS.
      - name: Verify repository
        run: pnpm verify:no-rust-tests --verbose

      - name: Verify generated state is committed
        run: git diff --exit-code

  rust-windows:
    name: Rust native (windows-latest, ${{ matrix.part }})
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # `pnpm verify:rust-native` as its four test parts, side by side: one job ran for an hour,
        # most of it in the terminal client's process tests. scripts/rust-test-parts.mjs defines
        # the parts; together they run every target once.
        part: [workspace, client, client-commands, client-long-commands]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install --profile minimal --component clippy,rustfmt
          rustc --version
          cargo --version

      # Third-party crates only. The client parts build one package and share an entry, which the
      # client part saves; see docs/VERIFICATION.md#ci-contract.
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-native-${{ matrix.part == 'workspace' && 'workspace' || 'client' }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && (matrix.part == 'workspace' || matrix.part == 'client') }}

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Restore the Terminal Host build cache
        uses: ./.github/actions/terminal-host-build-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the Rust workspace natively
        run: pnpm verify:rust-native --part ${{ matrix.part }} --verbose

      # Every part builds the same Host; the workspace part keeps it for later runs on main.
      - name: Save the Terminal Host build cache
        if: ${{ github.ref == 'refs/heads/main' && matrix.part == 'workspace' && !cancelled() }}
        uses: ./.github/actions/terminal-host-build-cache
        with:
          save: 'true'

  rust-macos:
    name: Rust native (macos-15, ${{ matrix.label }})
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # The same test parts as `rust-windows`. The long command targets are Windows process
        # tests, empty on macOS, and they and the native Terminal Host tests share the shortest
        # part's job, so a run needs three macOS runners rather than five (docs/VERIFICATION.md).
        include:
          - part: workspace
            label: workspace
          - part: client
            label: client
          - part: client-commands
            also: client-long-commands
            label: client-commands, client-long-commands, Terminal Host
            host: true
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install --profile minimal --component clippy,rustfmt
          rustc --version
          cargo --version

      # Third-party crates only. The client parts build one package and share an entry, which the
      # client part saves; see docs/VERIFICATION.md#ci-contract.
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-native-${{ matrix.part == 'workspace' && 'workspace' || 'client' }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && (matrix.part == 'workspace' || matrix.part == 'client') }}

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Restore the Terminal Host build cache
        uses: ./.github/actions/terminal-host-build-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the Rust workspace natively
        run: pnpm verify:rust-native --part ${{ matrix.part }} --verbose

      # Runs after a red Rust part too, so a run reports both.
      - name: Verify the shared Rust test part natively
        if: ${{ matrix.also && !cancelled() }}
        run: pnpm verify:rust-native --part ${{ matrix.also }} --verbose

      # Every part builds the same Host; the workspace part keeps it for later runs on main.
      - name: Save the Terminal Host build cache
        if: ${{ github.ref == 'refs/heads/main' && matrix.part == 'workspace' && !cancelled() }}
        uses: ./.github/actions/terminal-host-build-cache
        with:
          save: 'true'

      # Runs after a red Rust part too, so a run reports both.
      - name: Test native Terminal Host
        if: ${{ matrix.host && !cancelled() }}
        run: pnpm --filter @orchbee/terminal-host test

      - name: Check native Terminal Host formatting
        if: ${{ matrix.host && !cancelled() }}
        run: pnpm --filter @orchbee/terminal-host format:check

  rust-linux:
    name: Rust native (ubuntu-latest, ${{ matrix.label }})
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    # Linux joins the release platforms, and its Cargo test suites were never run in CI; until every
    # part is green, a red Linux part reports without failing the run.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # The same test parts as `rust-macos`: the long command targets are Windows process tests,
        # empty here, and they and the native Terminal Host tests share the shortest part's job.
        include:
          - part: workspace
            label: workspace
          - part: client
            label: client
          - part: client-commands
            also: client-long-commands
            label: client-commands, client-long-commands, Terminal Host
            host: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal --component clippy,rustfmt
          rustc --version
          cargo --version

      # Third-party crates only. The client parts build one package and share an entry, which the
      # client part saves; see docs/VERIFICATION.md#ci-contract.
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-native-${{ matrix.part == 'workspace' && 'workspace' || 'client' }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && (matrix.part == 'workspace' || matrix.part == 'client') }}

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Restore the Terminal Host build cache
        uses: ./.github/actions/terminal-host-build-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The shells the installed-shell and login-shell tests start.
      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Verify the Rust workspace natively
        run: pnpm verify:rust-native --part ${{ matrix.part }} --verbose

      # Runs after a red Rust part too, so a run reports both.
      - name: Verify the shared Rust test part natively
        if: ${{ matrix.also && !cancelled() }}
        run: pnpm verify:rust-native --part ${{ matrix.also }} --verbose

      # Every part builds the same Host; the workspace part keeps it for later runs on main.
      - name: Save the Terminal Host build cache
        if: ${{ github.ref == 'refs/heads/main' && matrix.part == 'workspace' && !cancelled() }}
        uses: ./.github/actions/terminal-host-build-cache
        with:
          save: 'true'

      # Runs after a red Rust part too, so a run reports both.
      - name: Test native Terminal Host
        if: ${{ matrix.host && !cancelled() }}
        run: pnpm --filter @orchbee/terminal-host test

  terminal-host-native:
    name: Terminal Host native (windows-latest)
    # macOS runs these steps in the `rust-macos` client-commands job.
    needs: scope
    if: ${{ needs.scope.outputs.terminal-host == 'true' }}
    runs-on: windows-latest
    # Room for the test deadline after a Zig download, when the archive is not cached yet.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Restore the Terminal Host test build cache
        uses: ./.github/actions/terminal-host-build-cache
        with:
          entry: test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native Terminal Host
        run: pnpm --filter @orchbee/terminal-host test

      - name: Save the Terminal Host test build cache
        if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
        uses: ./.github/actions/terminal-host-build-cache
        with:
          entry: test
          save: 'true'

      - name: Check native Terminal Host formatting
        run: pnpm --filter @orchbee/terminal-host format:check

  # GitHub cancels a macOS job that no runner took within 15 minutes and reports the run as failed,
  # although no check ran. When that is the only thing not green, the run ends cancelled instead, so
  # a failed run always names a check that failed. A real failure or a job that ran out of time
  # leaves the run as it is.
  macos-runner-shortage:
    name: Report a missing macOS runner
    needs: [verify, rust-windows, rust-macos, terminal-host-native]
    if: ${{ !cancelled() && needs.rust-macos.result != 'success' && needs.rust-macos.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: End the run as cancelled when only an unassigned macOS job is not green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq "[.jobs[] | select(.status == \"completed\") | select($1)] | length"
          }
          unassigned='(.conclusion == "cancelled" and (.steps | length) == 0 and (.name | startswith("Rust native (macos-15")))'
          without_runner="$(count "$unassigned")"
          not_green="$(count "(.conclusion != \"success\" and .conclusion != \"skipped\") and ($unassigned | not)")"
          echo "macOS jobs without a runner: $without_runner; other jobs not green: $not_green"
          if [ "$without_runner" -eq 0 ] || [ "$not_green" -ne 0 ]; then
            exit 0
          fi
          echo "::notice title=No macOS runner::GitHub assigned no runner to $without_runner macOS job(s), so nothing ran there. Every other job passed; this run ends cancelled, not failed."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          # The cancellation ends this job; a run that GitHub does not cancel stays as it was.
          sleep 120
