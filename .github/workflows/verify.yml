name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Zig
        env:
          ORCHBEE_ZIG_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
          ORCHBEE_ZIG_URL: https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
        run: |
          curl --fail --location --silent --show-error "$ORCHBEE_ZIG_URL" --output "$RUNNER_TEMP/orchbee-zig.tar.xz"
          echo "$ORCHBEE_ZIG_SHA256  $RUNNER_TEMP/orchbee-zig.tar.xz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/orchbee-zig"
          tar -xJf "$RUNNER_TEMP/orchbee-zig.tar.xz" --strip-components=1 --directory "$RUNNER_TEMP/orchbee-zig"
          echo "$RUNNER_TEMP/orchbee-zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/orchbee-zig/zig" version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

      - name: Verify generated state is committed
        run: git diff --exit-code

  terminal-host-native:
    name: Terminal Host native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Zig on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64)
              zig_url="https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz"
              zig_sha256="3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b"
              ;;
            x86_64)
              zig_url="https://ziglang.org/download/0.15.2/zig-x86_64-macos-0.15.2.tar.xz"
              zig_sha256="375b6909fc1495d16fc2c7db9538f707456bfc3373b14ee83fdd3e22b3d43f7f"
              ;;
            *)
              exit 1
              ;;
          esac
          curl --fail --location --silent --show-error "$zig_url" --output "$RUNNER_TEMP/orchbee-zig.tar.xz"
          echo "$zig_sha256  $RUNNER_TEMP/orchbee-zig.tar.xz" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/orchbee-zig"
          tar -xJf "$RUNNER_TEMP/orchbee-zig.tar.xz" --strip-components=1 --directory "$RUNNER_TEMP/orchbee-zig"
          echo "$RUNNER_TEMP/orchbee-zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/orchbee-zig/zig" version

      - name: Set up Zig on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zigUrl = 'https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip'
          $zigSha256 = '3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c'
          $archive = Join-Path $env:RUNNER_TEMP 'orchbee-zig.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'orchbee-zig'
          curl.exe --fail --location --silent --show-error $zigUrl --output $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $zigSha256) { throw "Unexpected Zig archive digest: $actual" }
          Expand-Archive -Path $archive -DestinationPath $destination
          $zigDirectory = (Get-ChildItem -Path $destination -Directory | Select-Object -First 1).FullName
          $zigDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $zigDirectory 'zig.exe') version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native Terminal Host
        run: pnpm --filter @orchbee/terminal-host test

      - name: Check native Terminal Host formatting
        run: pnpm --filter @orchbee/terminal-host format:check
