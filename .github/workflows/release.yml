name: Release

# Two ways in. Started by hand without a version: the dry run builds every Windows platform row
# marked `build` with the TEST identity, signs its manifest with the repository's test key, proves
# the result on fresh runners, and publishes nothing. A pushed tag v<version>, or a manual run naming
# a version (a rehearsal): the release path builds the rows with the release identity, signs in the
# environment `release`, proves the files on fresh runners, updates the older releases the release
# gate selects to them, presses Update in a real Test window of each row, and joins every row's
# files into one set. A tag takes the rows marked
# `build` and `publish`; a rehearsal takes every row marked `build`, so a row is rehearsed before it
# publishes. A tag run alone then publishes with no human step: a
# draft GitHub release whose notes are the annotated tag's message, the npm packages, then the
# release as Latest, and starts the Update check. A lightweight tag or an empty tag message stops it
# before the build. A rehearsal cannot publish: `release-publish` is the only job with write
# permissions or the npm token, and it runs only for a `push` event whose plan says `publish`.
# Rules for changing this file: docs/VERIFICATION.md#release-and-update-check-workflows; the owner's
# steps: docs/RELEASING.md. The comments here are the description of each job.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Empty for the test-identity dry run; a version such as 0.1.0-beta.1 rehearses the release path without publishing
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # One row per release platform token. `build` builds, packages and smoke-tests the row on its
  # runner, in a rehearsal and, for Windows rows, in the dry run; a tag takes the rows with `build`
  # and `publish`. Windows and macOS rows have jobs. The macOS rows publish since the rehearsal for
  # 0.1.0-beta.14 passed, so a macOS failure stops the whole tag.
  RELEASE_PLATFORMS: >-
    [
    {"platform": "windows-x86_64", "runner": "windows-latest", "build": true, "publish": true},
    {"platform": "windows-aarch64", "runner": "windows-11-arm", "build": false, "publish": false},
    {"platform": "macos-aarch64", "runner": "macos-15", "build": true, "publish": true},
    {"platform": "macos-x86_64", "runner": "macos-15-intel", "build": true, "publish": true},
    {"platform": "linux-x86_64", "runner": "ubuntu-24.04", "build": false, "publish": false},
    {"platform": "linux-aarch64", "runner": "ubuntu-24.04-arm", "build": false, "publish": false}
    ]

jobs:
  plan:
    name: Select platform rows
    # The dry run only; every other job of the dry run follows this one.
    if: github.event_name == 'workflow_dispatch' && inputs.version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.rows.outputs.build }}
    steps:
      # Its jobs build Windows only; a rehearsal proves the macOS rows.
      - name: Select the rows to build
        id: rows
        run: |
          echo "build=$(jq --compact-output '{include: map(select(.build and (.platform | startswith("windows-"))))}' <<< "$RELEASE_PLATFORMS")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      ORCHBEE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo --version

      - name: Set up Zig
        run: |
          $zigUrl = 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip'
          $zigSha256 = '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e'
          $archive = Join-Path $env:RUNNER_TEMP 'orchbee-zig.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'orchbee-zig'
          curl.exe --fail --location --silent --show-error --ssl-revoke-best-effort --retry 5 --retry-all-errors $zigUrl --output $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $zigSha256) { throw "Unexpected Zig archive digest: $actual" }
          Expand-Archive -Path $archive -DestinationPath $destination
          $zigDirectory = (Get-ChildItem -Path $destination -Directory | Select-Object -First 1).FullName
          $zigDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $zigDirectory 'zig.exe') version

      # The official installer, checked by digest, unpacked by its own portable mode into the run's
      # temporary folder; apps/desktop/installer/windows/orchbee.iss refuses any other compiler version.
      - name: Set up Inno Setup
        run: |
          $setupUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe'
          $setupSha256 = '4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.1.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'innosetup'
          curl.exe --fail --location --silent --show-error --ssl-revoke-best-effort --retry 5 --retry-all-errors $setupUrl --output $setup
          $actual = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          if ($actual -ne $setupSha256) { throw "Unexpected Inno Setup installer digest: $actual" }
          $unpack = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @('/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=`"$destination`"")
          if ($unpack.ExitCode -ne 0) { throw "Inno Setup unpacking exited $($unpack.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $destination 'ISCC.exe'))) { throw 'Inno Setup unpacked no ISCC.exe' }

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the test installer
        env:
          ORCHBEE_INNO_SETUP_COMPILER: ${{ runner.temp }}\innosetup\ISCC.exe
        run: pnpm desktop:installer:test --build-id "${{ github.sha }}.${{ github.run_number }}"

      - name: Collect the release artifacts
        run: node scripts/release-artifacts.mjs collect --profile test --output "$env:RUNNER_TEMP\release-artifacts"

      - name: Upload the release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-test-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts
          if-no-files-found: error
          # The release directory holds dot-named plugin folders, which the action skips by default.
          include-hidden-files: true
          retention-days: 3

  smoke:
    name: Smoke ${{ matrix.platform }} installer
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-test-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts

      - name: Check the release artifacts
        run: node scripts/release-artifacts.mjs check "$env:RUNNER_TEMP\release-artifacts"

      - name: Install silently
        run: node scripts/release-smoke-windows.mjs install "$env:RUNNER_TEMP\release-artifacts" --logs "$env:RUNNER_TEMP\smoke-logs"

      - name: Run the command from a new terminal
        run: node scripts/release-smoke-windows.mjs command "$env:RUNNER_TEMP\release-artifacts"

      - name: Uninstall silently
        run: node scripts/release-smoke-windows.mjs uninstall "$env:RUNNER_TEMP\release-artifacts" --logs "$env:RUNNER_TEMP\smoke-logs"

      - name: Scan for leftovers
        run: node scripts/release-smoke-windows.mjs leftovers "$env:RUNNER_TEMP\release-artifacts"

  smoke-npm:
    name: Smoke ${{ matrix.platform }} npm
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-test-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts

      - name: Check the release artifacts
        run: node scripts/release-artifacts.mjs check "$env:RUNNER_TEMP\release-artifacts"

      - name: Install, start and uninstall through npm
        run: node scripts/release-smoke-windows.mjs npm "$env:RUNNER_TEMP\release-artifacts" --prefix "$env:RUNNER_TEMP\npm-prefix"

      - name: Scan for leftovers
        run: node scripts/release-smoke-windows.mjs leftovers "$env:RUNNER_TEMP\release-artifacts"

  # The release path. Each job fails early and definitely; only `release-preconditions`,
  # `release-sign`, `release-feed` and `release-publish` use the environment `release`, and each maps
  # every secret into the one step that needs it.
  release-plan:
    name: Release version
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      dist-tag: ${{ steps.plan.outputs.dist-tag }}
      # Every row; the Windows and the macOS rows; whether there is a macOS row.
      matrix: ${{ steps.plan.outputs.matrix }}
      windows-matrix: ${{ steps.plan.outputs.windows-matrix }}
      macos-matrix: ${{ steps.plan.outputs.macos-matrix }}
      macos: ${{ steps.plan.outputs.macos }}
      # Whether the release gate runs a path, and one row per older release it updates from.
      gate: ${{ steps.gate.outputs.gate }}
      gate-matrix: ${{ steps.gate.outputs.gate-matrix }}
      macos-gate: ${{ steps.gate.outputs.macos-gate }}
      macos-gate-matrix: ${{ steps.gate.outputs.macos-gate-matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Plan the release
        id: plan
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: node scripts/release-publish.mjs plan --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --version "$VERSION_INPUT"

      # A tag run's notes are its annotated message, read through the API because the checkout
      # drops tag annotations; a rehearsal needs none.
      - name: Read the release notes from the tag message
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: node scripts/release-publish.mjs notes --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

      - name: Check every version source against the version
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: node scripts/release-version.mjs check "$RELEASE_TAG"

      # Reads the published releases; a rehearsal selects the same paths as a tag would.
      - name: Select the release gate's paths
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          MACOS_AARCH64: ${{ steps.plan.outputs.macos-aarch64 }}
        run: node scripts/release-publish.mjs gate-paths --version "$RELEASE_VERSION" --repository "$GITHUB_REPOSITORY" --macos-aarch64 "$MACOS_AARCH64"

  release-preconditions:
    name: Release preconditions
    needs: release-plan
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # A tag run also needs the npm credential; a rehearsal never sees it.
      - name: Check the signing key, its trusted public half and the npm credential
        env:
          PUBLISH: ${{ needs.release-plan.outputs.publish }}
          ORCHBEE_RELEASE_SIGNING_KEY: ${{ secrets.ORCHBEE_RELEASE_SIGNING_KEY }}
          NPM_TOKEN: ${{ needs.release-plan.outputs.publish == 'true' && secrets.NPM_TOKEN || '' }}
        run: |
          npm_check=()
          if [ "$PUBLISH" = true ]; then npm_check=(--npm-token-env NPM_TOKEN); fi
          node scripts/release-publish.mjs preconditions --signing-key-env ORCHBEE_RELEASE_SIGNING_KEY "${npm_check[@]}"

  release-build:
    name: Release build ${{ matrix.platform }}
    needs: [release-plan, release-preconditions]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.windows-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      ORCHBEE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo --version

      # The same pinned download as the dry run's build job.
      - name: Set up Zig
        run: |
          $zigUrl = 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip'
          $zigSha256 = '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e'
          $archive = Join-Path $env:RUNNER_TEMP 'orchbee-zig.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'orchbee-zig'
          curl.exe --fail --location --silent --show-error --ssl-revoke-best-effort --retry 5 --retry-all-errors $zigUrl --output $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $zigSha256) { throw "Unexpected Zig archive digest: $actual" }
          Expand-Archive -Path $archive -DestinationPath $destination
          $zigDirectory = (Get-ChildItem -Path $destination -Directory | Select-Object -First 1).FullName
          $zigDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $zigDirectory 'zig.exe') version

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Stage the release cohort
        run: node scripts/stage-local-runtime.mjs --output "$env:RUNNER_TEMP\cohort" --artifact-stem orchbee

      - name: Describe the release cohort
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
          BUILD_ID: ${{ github.sha }}.${{ github.run_number }}
        run: node scripts/package-native-release.mjs "$env:RUNNER_TEMP\cohort" stable "$env:RELEASE_VERSION" "$env:BUILD_ID"

      - name: Upload the unsigned cohort
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cohort-${{ matrix.platform }}
          path: ${{ runner.temp }}\cohort
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      # The signing job receives only the manifest it signs.
      - name: Upload the manifest to sign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-${{ matrix.platform }}
          path: ${{ runner.temp }}\cohort\release.json
          if-no-files-found: error
          retention-days: 1

  # The macOS rows' `release-build`, in bash, with the pinned Zig download of the Verify job
  # `rust-macos`. The macOS jobs run only when the plan has a macOS row, since a job with no row
  # fails.
  release-build-macos:
    name: Release build ${{ matrix.platform }}
    needs: [release-plan, release-preconditions]
    if: needs.release-plan.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      ORCHBEE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo --version

      # The same pinned download as the Verify job `rust-macos`.
      - name: Set up Zig
        run: |
          case "$(uname -m)" in
            arm64)
              zig_url="https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz"
              zig_sha256="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
              ;;
            x86_64)
              zig_url="https://ziglang.org/download/0.16.0/zig-x86_64-macos-0.16.0.tar.xz"
              zig_sha256="0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7"
              ;;
            *)
              exit 1
              ;;
          esac
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors "$zig_url" --output "$RUNNER_TEMP/orchbee-zig.tar.xz"
          echo "$zig_sha256  $RUNNER_TEMP/orchbee-zig.tar.xz" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/orchbee-zig"
          tar -xJf "$RUNNER_TEMP/orchbee-zig.tar.xz" --strip-components=1 --directory "$RUNNER_TEMP/orchbee-zig"
          echo "$RUNNER_TEMP/orchbee-zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/orchbee-zig/zig" version

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Stage the release cohort
        run: node scripts/stage-local-runtime.mjs --output "$RUNNER_TEMP/cohort" --artifact-stem orchbee

      - name: Describe the release cohort
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
          BUILD_ID: ${{ github.sha }}.${{ github.run_number }}
        run: node scripts/package-native-release.mjs "$RUNNER_TEMP/cohort" stable "$RELEASE_VERSION" "$BUILD_ID"

      # The manifest's platform is the runner's own; an Intel row built on Apple silicon would fail here.
      - name: Check the platform token
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          token="$(jq -r .platform "$RUNNER_TEMP/cohort/release.json")"
          if [ "$token" != "$PLATFORM" ]; then echo "The cohort is for $token, not $PLATFORM" >&2; exit 1; fi

      - name: Upload the unsigned cohort
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cohort-${{ matrix.platform }}
          path: ${{ runner.temp }}/cohort
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Upload the manifest to sign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-${{ matrix.platform }}
          path: ${{ runner.temp }}/cohort/release.json
          if-no-files-found: error
          retention-days: 1

  # Every row's manifest. A family's build counts only when the plan has its rows: a job the plan
  # leaves out is skipped, and a skipped build of a planned family stops the run here.
  release-sign:
    name: Release sign ${{ matrix.platform }}
    needs: [release-plan, release-build, release-build-macos]
    if: >-
      ${{ !cancelled() && needs.release-build.result == 'success' &&
      (needs.release-build-macos.result == 'success' || needs.release-plan.outputs.macos == 'false') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.matrix) }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest-${{ matrix.platform }}
          path: ${{ runner.temp }}/manifest

      # Node built-ins only; the key never leaves this step's environment.
      - name: Sign the manifest with the release key
        env:
          ORCHBEE_RELEASE_SIGNING_KEY: ${{ secrets.ORCHBEE_RELEASE_SIGNING_KEY }}
        run: node scripts/sign-release-manifest.mjs "$RUNNER_TEMP/manifest/release.json" --key-env ORCHBEE_RELEASE_SIGNING_KEY

      - name: Upload the signature
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-signature-${{ matrix.platform }}
          path: ${{ runner.temp }}/manifest/release.json.sig
          if-no-files-found: error
          retention-days: 1

  # From `release-sign` on, every job states the results it needs: GitHub's implied `success()`
  # also fails for a skipped ancestor, such as the macOS build of a run without macOS rows.
  release-package:
    name: Release package ${{ matrix.platform }}
    needs: [release-plan, release-sign]
    if: ${{ !cancelled() && needs.release-sign.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.windows-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The same pinned download as the dry run's build job.
      - name: Set up Inno Setup
        run: |
          $setupUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe'
          $setupSha256 = '4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.1.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'innosetup'
          curl.exe --fail --location --silent --show-error --ssl-revoke-best-effort --retry 5 --retry-all-errors $setupUrl --output $setup
          $actual = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          if ($actual -ne $setupSha256) { throw "Unexpected Inno Setup installer digest: $actual" }
          $unpack = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @('/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=`"$destination`"")
          if ($unpack.ExitCode -ne 0) { throw "Inno Setup unpacking exited $($unpack.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $destination 'ISCC.exe'))) { throw 'Inno Setup unpacked no ISCC.exe' }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the unsigned cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-cohort-${{ matrix.platform }}
          path: ${{ runner.temp }}\cohort

      - name: Download the signature beside it
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-signature-${{ matrix.platform }}
          path: ${{ runner.temp }}\cohort

      - name: Build the package inputs
        run: pnpm --filter @orchbee/desktop build:package-inputs

      - name: Build the release installer from the signed cohort
        env:
          ORCHBEE_INNO_SETUP_COMPILER: ${{ runner.temp }}\innosetup\ISCC.exe
        run: node apps/desktop/scripts/package.mjs --profile release --installer --cohort "$env:RUNNER_TEMP\cohort"

      - name: Collect the release artifacts
        run: node scripts/release-artifacts.mjs collect --profile release --output "$env:RUNNER_TEMP\release-artifacts"

      # A tag run keeps them long enough to run a failed publication again; a rehearsal only for
      # its smoke.
      - name: Upload the release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 1 }}

      # The feed job receives only the feed document it signs. A tag run keeps it as long as the
      # release artifacts, so a failed feed job can run again.
      - name: Upload the feed to sign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-feed-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts\orchbee-${{ needs.release-plan.outputs.version }}-${{ matrix.platform }}.feed.json
          if-no-files-found: error
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 1 }}

  # The macOS rows' `release-package`, in bash: the Desktop's ad hoc signed application and disk
  # image from the signed cohort, then the collected artifacts with the `.tar.gz`.
  release-package-macos:
    name: Release package ${{ matrix.platform }}
    needs: [release-plan, release-sign]
    if: ${{ !cancelled() && needs.release-plan.outputs.macos == 'true' && needs.release-sign.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the unsigned cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-cohort-${{ matrix.platform }}
          path: ${{ runner.temp }}/cohort

      - name: Download the signature beside it
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-signature-${{ matrix.platform }}
          path: ${{ runner.temp }}/cohort

      # Artifacts keep no file modes; the packaging and the manifest's programs need these four, and
      # the application runs the window launcher when its window relaunches.
      - name: Restore the programs' executable bit
        run: |
          for program in orchbee orchbee-server orchbee-worker orchbee-terminal-host orchbee-desktop-launcher; do
            chmod +x "$RUNNER_TEMP/cohort/$program"
          done

      - name: Build the package inputs
        run: pnpm --filter @orchbee/desktop build:package-inputs

      - name: Build the application and disk image from the signed cohort
        run: node apps/desktop/scripts/package.mjs --profile release --installer --cohort "$RUNNER_TEMP/cohort"

      - name: Collect the release artifacts
        run: node scripts/release-artifacts.mjs collect --profile release --output "$RUNNER_TEMP/release-artifacts"

      - name: Upload the release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-artifacts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 1 }}

      - name: Upload the feed to sign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-feed-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-artifacts/orchbee-${{ needs.release-plan.outputs.version }}-${{ matrix.platform }}.feed.json
          if-no-files-found: error
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 1 }}

  # Signs the update feed document and the release gate's copy of it, which names the archive by its
  # file name, for every row. Every release-path run signs, so a rehearsal proves this job before a
  # tag does. Like `release-sign`, it runs only scripts that use Node built-ins. Ed25519 is
  # deterministic, so a re-run writes the same signatures.
  release-feed:
    name: Release feed ${{ matrix.platform }}
    needs: [release-plan, release-package, release-package-macos]
    if: >-
      ${{ !cancelled() && needs.release-package.result == 'success' &&
      (needs.release-package-macos.result == 'success' || needs.release-plan.outputs.macos == 'false') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.matrix) }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FEED_NAME: orchbee-${{ needs.release-plan.outputs.version }}-${{ matrix.platform }}.feed.json
      GATE_FEED_NAME: orchbee-${{ needs.release-plan.outputs.version }}-${{ matrix.platform }}.gate.feed.json
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the feed
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-feed-${{ matrix.platform }}
          path: ${{ runner.temp }}/feed

      - name: Write the gate copy of the feed
        run: node scripts/release-feed.mjs gate "$RUNNER_TEMP/feed/$FEED_NAME"

      # The key reaches this step alone, by environment.
      - name: Sign the update feed and its gate copy with the release key
        env:
          ORCHBEE_RELEASE_SIGNING_KEY: ${{ secrets.ORCHBEE_RELEASE_SIGNING_KEY }}
        run: |
          node scripts/sign-release-manifest.mjs "$RUNNER_TEMP/feed/$FEED_NAME" --key-env ORCHBEE_RELEASE_SIGNING_KEY
          node scripts/sign-release-manifest.mjs "$RUNNER_TEMP/feed/$GATE_FEED_NAME" --key-env ORCHBEE_RELEASE_SIGNING_KEY

      # A tag run keeps both as long as the release artifacts, for a re-run of a later job.
      - name: Upload the feed signature
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-feed-signature-${{ matrix.platform }}
          path: ${{ runner.temp }}/feed/${{ env.FEED_NAME }}.sig
          if-no-files-found: error
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 1 }}

      - name: Upload the signed gate copy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-gate-feed-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/feed/${{ env.GATE_FEED_NAME }}
            ${{ runner.temp }}/feed/${{ env.GATE_FEED_NAME }}.sig
          if-no-files-found: error
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 1 }}

  release-smoke:
    name: Release smoke ${{ matrix.platform }} installer
    needs: [release-plan, release-package]
    if: ${{ !cancelled() && needs.release-package.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.windows-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts

      - name: Check the release artifacts
        run: node scripts/release-artifacts.mjs check "$env:RUNNER_TEMP\release-artifacts"

      - name: Install silently
        run: node scripts/release-smoke-windows.mjs install "$env:RUNNER_TEMP\release-artifacts" --logs "$env:RUNNER_TEMP\smoke-logs"

      - name: Run the command from a new terminal
        run: node scripts/release-smoke-windows.mjs command "$env:RUNNER_TEMP\release-artifacts"

      - name: Uninstall silently
        run: node scripts/release-smoke-windows.mjs uninstall "$env:RUNNER_TEMP\release-artifacts" --logs "$env:RUNNER_TEMP\smoke-logs"

      - name: Scan for leftovers
        run: node scripts/release-smoke-windows.mjs leftovers "$env:RUNNER_TEMP\release-artifacts"

  release-smoke-npm:
    name: Release smoke ${{ matrix.platform }} npm
    needs: [release-plan, release-package]
    if: ${{ !cancelled() && needs.release-package.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.windows-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts

      - name: Check the release artifacts
        run: node scripts/release-artifacts.mjs check "$env:RUNNER_TEMP\release-artifacts"

      - name: Install, start and uninstall through npm
        run: node scripts/release-smoke-windows.mjs npm "$env:RUNNER_TEMP\release-artifacts" --prefix "$env:RUNNER_TEMP\npm-prefix"

      - name: Scan for leftovers
        run: node scripts/release-smoke-windows.mjs leftovers "$env:RUNNER_TEMP\release-artifacts"

  # The macOS rows' smoke on fresh runners with those exact files: the disk image, the `.tar.gz`
  # through `orchbee install`, the website's install.sh with `--desktop` against a local copy of the
  # row's feed, and the npm route, each in its own scratch HOME.
  release-smoke-macos:
    name: Release smoke ${{ matrix.platform }}
    needs: [release-plan, release-package-macos]
    if: ${{ !cancelled() && needs.release-plan.outputs.macos == 'true' && needs.release-package-macos.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-artifacts

      - name: Check the release artifacts
        run: node scripts/release-artifacts.mjs check "$RUNNER_TEMP/release-artifacts"

      - name: Mount, verify and run the disk image
        run: node scripts/release-smoke-macos.mjs disk-image "$RUNNER_TEMP/release-artifacts" --work "$RUNNER_TEMP/smoke-disk-image"

      - name: Install and uninstall the archive
        run: node scripts/release-smoke-macos.mjs archive "$RUNNER_TEMP/release-artifacts" --work "$RUNNER_TEMP/smoke-archive"

      - name: Install the archive and the desktop app through install.sh
        run: node scripts/release-smoke-macos.mjs install-script "$RUNNER_TEMP/release-artifacts" --work "$RUNNER_TEMP/smoke-install-script"

      - name: Install, start and uninstall through npm
        run: node scripts/release-smoke-macos.mjs npm "$RUNNER_TEMP/release-artifacts" --work "$RUNNER_TEMP/smoke-npm"

  # The real-window Update check (scripts/release-window-update.mjs) beside the release build, from
  # the plan on: a Test window built here, because a release build never opens the DevTools port the
  # check drives, and two older stand-ins copied from it, in a scratch store root and data root.
  # Nothing is downloaded but the toolchains. A failure keeps the page's screenshot and DOM and the
  # data root's logs for three days and stops the release before Publish.
  release-window-update:
    name: Release window Update ${{ matrix.platform }}
    needs: release-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.windows-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      ORCHBEE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo --version

      # The same pinned download as the dry run's build job.
      - name: Set up Zig
        run: |
          $zigUrl = 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip'
          $zigSha256 = '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e'
          $archive = Join-Path $env:RUNNER_TEMP 'orchbee-zig.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'orchbee-zig'
          curl.exe --fail --location --silent --show-error --ssl-revoke-best-effort --retry 5 --retry-all-errors $zigUrl --output $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $zigSha256) { throw "Unexpected Zig archive digest: $actual" }
          Expand-Archive -Path $archive -DestinationPath $destination
          $zigDirectory = (Get-ChildItem -Path $destination -Directory | Select-Object -First 1).FullName
          $zigDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $zigDirectory 'zig.exe') version

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Test window
        run: pnpm desktop:package:test --build-id "${{ github.sha }}.${{ github.run_number }}"

      # The work folder lies in the profile, as a person's data root does.
      - name: Press Update in the real window
        run: |
          $windows = @(Get-ChildItem -LiteralPath 'apps\desktop\out\test' -Directory)
          if ($windows.Count -ne 1) { throw "apps\desktop\out\test holds $($windows.Count) folders, not one packaged window" }
          node scripts/release-smoke-windows.mjs window-update $windows[0].FullName --work "$env:USERPROFILE\window-update" --diagnostics "$env:RUNNER_TEMP\window-update-diagnostics"

      - name: Keep the diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-window-update-${{ matrix.platform }}
          path: ${{ runner.temp }}\window-update-diagnostics
          if-no-files-found: ignore
          retention-days: 3

  # The macOS rows' real-window Update check, in bash, as on Windows.
  release-window-update-macos:
    name: Release window Update ${{ matrix.platform }}
    needs: release-plan
    if: needs.release-plan.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      ORCHBEE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo --version

      # The same pinned download as `release-build-macos`.
      - name: Set up Zig
        run: |
          case "$(uname -m)" in
            arm64)
              zig_url="https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz"
              zig_sha256="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
              ;;
            x86_64)
              zig_url="https://ziglang.org/download/0.16.0/zig-x86_64-macos-0.16.0.tar.xz"
              zig_sha256="0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7"
              ;;
            *)
              exit 1
              ;;
          esac
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors "$zig_url" --output "$RUNNER_TEMP/orchbee-zig.tar.xz"
          echo "$zig_sha256  $RUNNER_TEMP/orchbee-zig.tar.xz" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/orchbee-zig"
          tar -xJf "$RUNNER_TEMP/orchbee-zig.tar.xz" --strip-components=1 --directory "$RUNNER_TEMP/orchbee-zig"
          echo "$RUNNER_TEMP/orchbee-zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/orchbee-zig/zig" version

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Test window
        run: pnpm desktop:package:test --build-id "${{ github.sha }}.${{ github.run_number }}"

      - name: Press Update in the real window
        run: |
          shopt -s nullglob
          windows=(apps/desktop/out/test/*/)
          if [ "${#windows[@]}" -ne 1 ]; then echo "apps/desktop/out/test holds ${#windows[@]} folders, not one packaged window" >&2; exit 1; fi
          node scripts/release-smoke-macos.mjs window-update "$PWD/${windows[0]%/}" --work "$RUNNER_TEMP/window-update" --diagnostics "$RUNNER_TEMP/window-update-diagnostics"

      - name: Keep the diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-window-update-${{ matrix.platform }}
          path: ${{ runner.temp }}/window-update-diagnostics
          if-no-files-found: ignore
          retention-days: 3

  # One path of the release gate per older release the plan selected, on a fresh runner, from that
  # release's published assets to this run's Windows archive and signed gate feed. With no path
  # selected the job is skipped, since a job with no row fails, and `release-publish` goes on; a
  # failed path stops the release before Publish. A rehearsal runs the same paths.
  release-gate:
    name: Release gate from ${{ matrix.older }}
    needs: [release-plan, release-feed]
    if: ${{ !cancelled() && needs.release-plan.outputs.gate == 'true' && needs.release-feed.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.gate-matrix) }}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-windows-x86_64
          path: ${{ runner.temp }}\gate

      # The gate copy names the archive by its file name, so it goes beside it.
      - name: Download the signed gate feed beside them
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-gate-feed-windows-x86_64
          path: ${{ runner.temp }}\gate

      # The gate's one platform is the one scripts/release-smoke-windows.mjs updates.
      - name: Update from ${{ matrix.older }} while a terminal keeps running
        env:
          OLDER: ${{ matrix.older }}
          GATE_FEED: ${{ runner.temp }}\gate\orchbee-${{ needs.release-plan.outputs.version }}-windows-x86_64.gate.feed.json
        run: node scripts/release-smoke-windows.mjs gate $env:OLDER --release "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$env:OLDER/" --feed "$env:GATE_FEED" --work "$env:RUNNER_TEMP\gate-work"

  # The Apple silicon pre-publish gate path from the newest published macOS release to this run's
  # `macos-aarch64` runtime and window archives. Skipped when no macOS row is planned or no older
  # macOS release exists yet; a failed path stops publication before GitHub Release or npm moves.
  release-gate-macos:
    name: Release gate macos-aarch64 from ${{ matrix.older }}
    needs: [release-plan, release-feed]
    if: ${{ !cancelled() && needs.release-plan.outputs.macos-gate == 'true' && needs.release-feed.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos-gate-matrix) }}
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-macos-aarch64
          path: ${{ runner.temp }}/gate

      # The gate copy names the archive and window archive by file name, so it goes beside them.
      - name: Download the signed gate feed beside them
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-gate-feed-macos-aarch64
          path: ${{ runner.temp }}/gate

      - name: Update from ${{ matrix.older }} while a terminal keeps running
        env:
          OLDER: ${{ matrix.older }}
          GATE_FEED: ${{ runner.temp }}/gate/orchbee-${{ needs.release-plan.outputs.version }}-macos-aarch64.gate.feed.json
        run: node scripts/release-smoke-macos.mjs gate "$OLDER" --release "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$OLDER/" --feed "$GATE_FEED" --work "$RUNNER_TEMP/gate-work"

  # Joins every row's artifacts, each with the feed signature `release-feed` made beside its feed,
  # into the one set `release-publish` publishes: one row unchanged, several with one main npm
  # package listing every row's platform package and one SHA256SUMS. A rehearsal runs it too, so it
  # proves the set a tag with the same rows publishes. No secret, no environment.
  release-join:
    name: Release join
    needs: [release-plan, release-feed]
    if: ${{ !cancelled() && needs.release-feed.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-assets-*
          path: ${{ runner.temp }}/release

      - name: Download the feed signatures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-feed-signature-*
          path: ${{ runner.temp }}/feed-signatures

      # Every row of the plan, each checked with its signature beside the feed; SHA256SUMS does not
      # list the signature.
      - name: Check every row and join them
        env:
          ROWS: ${{ needs.release-plan.outputs.matrix }}
        run: |
          rows=()
          for platform in $(jq -r '.include[].platform' <<< "$ROWS"); do
            row="$RUNNER_TEMP/release/release-assets-$platform"
            cp "$RUNNER_TEMP/feed-signatures/release-feed-signature-$platform/"*.feed.json.sig "$row/"
            node scripts/release-artifacts.mjs check "$row"
            rows+=("$row")
          done
          node scripts/release-artifacts.mjs join --output "$RUNNER_TEMP/release-joined" "${rows[@]}"

      # A tag run keeps it as long as the row artifacts, for a re-run of the publication.
      - name: Upload the joined release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-joined
          path: ${{ runner.temp }}/release-joined
          if-no-files-found: error
          include-hidden-files: true
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 1 }}

  # Tag runs only, with no approval: cancelling the run before this job starts is the way to stop a
  # release. GitHub first, as a draft; then npm, because a published npm version can never be
  # replaced; then the draft becomes the Latest release, so a failed npm step leaves it a draft.
  # Run again, the job finishes a partial publication. The condition names the `push` event as well
  # as the plan's `publish`, so no manual run reaches it; every needed job must have passed, the
  # macOS smoke and window Update check may be skipped only when the plan has no macOS row, and the
  # release gate only when the plan selected no path.
  release-publish:
    name: Publish ${{ needs.release-plan.outputs.tag }}
    needs:
      [
        release-plan,
        release-join,
        release-smoke,
        release-smoke-npm,
        release-smoke-macos,
        release-window-update,
        release-window-update-macos,
        release-gate,
        release-gate-macos,
      ]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.release-plan.outputs.publish == 'true' &&
      needs.release-join.result == 'success' && needs.release-smoke.result == 'success' &&
      needs.release-smoke-npm.result == 'success' &&
      (needs.release-smoke-macos.result == 'success' || needs.release-plan.outputs.macos == 'false') &&
      needs.release-window-update.result == 'success' &&
      (needs.release-window-update-macos.result == 'success' || needs.release-plan.outputs.macos == 'false') &&
      (needs.release-gate.result == 'success' || needs.release-plan.outputs.gate == 'false') &&
      (needs.release-gate-macos.result == 'success' || needs.release-plan.outputs.macos-gate == 'false') }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # actions: write lets the token dispatch the Update check.
      actions: write
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Name the artifacts directory
        run: echo "ARTIFACTS=$RUNNER_TEMP/release" >> "$GITHUB_ENV"

      # registry-url makes npm read its credential from NODE_AUTH_TOKEN, set only in the npm step.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The joined set, every feed signature `release-feed` made beside its feed.
      - name: Download the joined release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-joined
          path: ${{ runner.temp }}/release

      # Also verifies each feed signature with RELEASE_KEYS and each feed against its archive.
      - name: Check the release artifacts
        run: node scripts/release-artifacts.mjs check "$ARTIFACTS"

      - name: Create or complete the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-publish.mjs github "$ARTIFACTS" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

      # Trusted publishing later replaces the token: drop NODE_AUTH_TOKEN here and the npm check of
      # release-preconditions; see docs/RELEASING.md.
      - name: Publish the npm packages, platform packages first
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-publish.mjs npm "$ARTIFACTS" --version "$RELEASE_VERSION" --repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

      - name: Publish the draft as the Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-publish.mjs publish "$ARTIFACTS" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

      # A release published with this job's token raises no `release: published` run, but the token
      # may dispatch a workflow.
      - name: Start the Update check
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-check.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$RELEASE_TAG"
