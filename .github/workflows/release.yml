name: Release

# Started by hand only. Builds every platform row marked `build` with the TEST identity, signs its
# manifest with the repository's test key, and proves the result on fresh runners. Nothing is signed
# with a release key, tagged, or published. Contract: docs/VERIFICATION.md#release-workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # One row per release platform token. `build` builds, packages and smoke-tests the row on its
  # runner; `publish` releases it once publication exists. Only Windows x64 has build steps today.
  RELEASE_PLATFORMS: >-
    [
    {"platform": "windows-x86_64", "runner": "windows-latest", "build": true, "publish": false},
    {"platform": "windows-aarch64", "runner": "windows-11-arm", "build": false, "publish": false},
    {"platform": "macos-aarch64", "runner": "macos-15", "build": false, "publish": false},
    {"platform": "macos-x86_64", "runner": "macos-15-intel", "build": false, "publish": false},
    {"platform": "linux-x86_64", "runner": "ubuntu-24.04", "build": false, "publish": false},
    {"platform": "linux-aarch64", "runner": "ubuntu-24.04-arm", "build": false, "publish": false}
    ]

jobs:
  plan:
    name: Select platform rows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.rows.outputs.build }}
    steps:
      - name: Select the rows to build
        id: rows
        run: |
          echo "build=$(jq --compact-output '{include: map(select(.build))}' <<< "$RELEASE_PLATFORMS")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      ORCHBEE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo --version

      - name: Set up Zig
        run: |
          $zigUrl = 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip'
          $zigSha256 = '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e'
          $archive = Join-Path $env:RUNNER_TEMP 'orchbee-zig.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'orchbee-zig'
          curl.exe --fail --location --silent --show-error $zigUrl --output $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $zigSha256) { throw "Unexpected Zig archive digest: $actual" }
          Expand-Archive -Path $archive -DestinationPath $destination
          $zigDirectory = (Get-ChildItem -Path $destination -Directory | Select-Object -First 1).FullName
          $zigDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $zigDirectory 'zig.exe') version

      # The official installer, checked by digest, unpacked by its own portable mode into the run's
      # temporary folder; apps/desktop/installer/windows/orchbee.iss refuses any other compiler version.
      - name: Set up Inno Setup
        run: |
          $setupUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe'
          $setupSha256 = '4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.1.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'innosetup'
          curl.exe --fail --location --silent --show-error $setupUrl --output $setup
          $actual = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          if ($actual -ne $setupSha256) { throw "Unexpected Inno Setup installer digest: $actual" }
          $unpack = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @('/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=`"$destination`"")
          if ($unpack.ExitCode -ne 0) { throw "Inno Setup unpacking exited $($unpack.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $destination 'ISCC.exe'))) { throw 'Inno Setup unpacked no ISCC.exe' }

      # Zig's own download of this transitive Terminal Host dependency (Ghostty's translate_c → arocc)
      # fails on GitHub's Windows runners with HttpConnectionClosing. curl fetches it, and `zig fetch`
      # admits it only under the content hash translate_c pins, so the build finds it offline. Drop
      # the step once Zig fetches it, or update it when the Ghostty pin moves translate_c.
      - name: Prefetch the arocc Zig package
        working-directory: apps/terminal-host
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'arocc.tar.gz'
          curl.exe --fail --location --silent --show-error 'https://github.com/vancluever/arocc/archive/ecbc5c799574e0da2758a961b12efa586007f03c.tar.gz' --output $archive
          $hash = zig fetch $archive
          if ($hash -ne 'aro-0.0.0-JSD1Qk8rOQDnuVcD4jAwMpHitA6pADRKzQ7M7hKRwxvD') { throw "Unexpected arocc package hash: $hash" }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the test installer
        env:
          ORCHBEE_INNO_SETUP_COMPILER: ${{ runner.temp }}\innosetup\ISCC.exe
        run: pnpm desktop:installer:test --build-id "${{ github.sha }}.${{ github.run_number }}"

      - name: Collect the release artifacts
        run: node scripts/release-artifacts.mjs collect --profile test --output "$env:RUNNER_TEMP\release-artifacts"

      - name: Upload the release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-test-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts
          if-no-files-found: error
          retention-days: 3

  smoke:
    name: Smoke ${{ matrix.platform }} installer
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-test-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts

      - name: Check the release artifacts
        run: node scripts/release-artifacts.mjs check "$env:RUNNER_TEMP\release-artifacts"

      - name: Install silently
        run: node scripts/release-smoke-windows.mjs install "$env:RUNNER_TEMP\release-artifacts" --logs "$env:RUNNER_TEMP\smoke-logs"

      - name: Run the command from a new terminal
        run: node scripts/release-smoke-windows.mjs command "$env:RUNNER_TEMP\release-artifacts"

      - name: Uninstall silently
        run: node scripts/release-smoke-windows.mjs uninstall "$env:RUNNER_TEMP\release-artifacts" --logs "$env:RUNNER_TEMP\smoke-logs"

      - name: Scan for leftovers
        run: node scripts/release-smoke-windows.mjs leftovers "$env:RUNNER_TEMP\release-artifacts"

  smoke-npm:
    name: Smoke ${{ matrix.platform }} npm
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-test-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts

      - name: Check the release artifacts
        run: node scripts/release-artifacts.mjs check "$env:RUNNER_TEMP\release-artifacts"

      - name: Install, start and uninstall through npm
        run: node scripts/release-smoke-windows.mjs npm "$env:RUNNER_TEMP\release-artifacts" --prefix "$env:RUNNER_TEMP\npm-prefix"

      - name: Scan for leftovers
        run: node scripts/release-smoke-windows.mjs leftovers "$env:RUNNER_TEMP\release-artifacts"
