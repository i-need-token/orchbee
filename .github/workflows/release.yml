name: Release

# Three ways in. Started by hand without a version: the dry run builds every Windows platform row
# marked `build` with the TEST identity, signs its manifest with the repository's test key, proves
# the result on fresh runners, and publishes nothing. A pushed tag v<version>, or a manual run naming
# a version (a rehearsal): the release path builds the rows with the release identity, signs in the
# environment `release`, proves the files on fresh runners, updates the older releases the release
# gate selects to them, presses Update in a real Test window of each row, and joins every row's
# files into one set. A tag takes the rows marked
# `build` and `publish`; a rehearsal takes every row marked `build`, so a row is rehearsed before it
# publishes. A tag run alone then publishes with no human step: a
# draft GitHub release whose notes are the annotated tag's message, the npm packages, then the
# release as Latest, and starts the Update check. A lightweight tag or an empty tag message stops it
# before the build. A rehearsal cannot publish: `release-publish` is the only job with write
# permissions or the npm token, and it runs only for a `push` event whose plan says `publish`.
# Once Verify passed for the newest commit of main, a release candidate rehearses that commit at the
# version main records, with no human step.
# A run whose commit a passed rehearsal, candidate or tag run already built, gated and joined takes
# that run's files of its own rows and joins them instead of building again, unless a manual run
# asks to rebuild, and a run that finds such a run still building waits for it; a tag after its
# candidate publishes in minutes, and a row the candidate built without publishing stays out.
# A tag publishes only once Verify passed for its commit.
# Rules for changing this file: docs/VERIFICATION.md#release-and-update-check-workflows; the owner's
# steps: docs/RELEASING.md. The comments here are the description of each job.

# The run name says what a run built: a later run of the same commit finds it by name. Every run
# checks each version source against its version, so a candidate's commit names its version. A
# finished Verify run that cannot start a candidate (it failed, was cancelled, checked a pull request
# or a commit main has moved past) leaves a run named "Release candidate skipped" that builds nothing.
run-name: >-
  ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) ||
  github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'success' &&
  github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha &&
  'Release candidate' || 'Release candidate skipped') ||
  inputs.version != '' && format('Release {0} rehearsal', inputs.version) || 'Release dry run' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Empty for the test-identity dry run; a version such as 0.1.0-beta.1 rehearses the release path without publishing
        required: false
        default: ''
        type: string
      rebuild:
        description: Build again even when a passed run of this commit and version can be reused
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'
  # A candidate. Its run is the default branch's newest commit, so release-start goes on only
  # when that is the commit a passed Verify of a push checked; a newer commit's Verify starts its own.
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Rehearsals and candidates of main share a group: one runs, and the newest waiting run replaces an
# older waiting one. A skipped candidate takes a group of its own, so it never replaces a waiting one.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_run' && !(github.event.workflow_run.conclusion == 'success' &&
    github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha) &&
    format('release-skipped-{0}', github.run_id) || format('release-{0}', github.ref) }}
  cancel-in-progress: false

env:
  # One row per release platform token. `build` builds, packages and smoke-tests the row on its
  # runner, in a rehearsal and, for Windows rows, in the dry run; a tag takes the rows with `build`
  # and `publish`. Windows, macOS and Linux rows have jobs. The macOS rows publish since the rehearsal
  # for 0.1.0-beta.14 passed, so a macOS failure stops the whole tag. A macOS row's `build-runner`
  # builds, signs, notarizes and packages it, since GitHub's Intel Macs take about 2.5 times as long;
  # the smoke test and the window Update still run its files on `runner`. A Linux row's command line
  # is linked statically against musl, and its window, AppImage and Debian package are built, on a
  # runner of its architecture.
  RELEASE_PLATFORMS: >-
    [
    {"platform": "windows-x86_64", "runner": "windows-latest", "build": true, "publish": true},
    {"platform": "windows-aarch64", "runner": "windows-11-arm", "build": false, "publish": false},
    {"platform": "macos-aarch64", "runner": "macos-15", "build": true, "publish": true},
    {"platform": "macos-x86_64", "runner": "macos-15-intel", "build-runner": "macos-15", "build": true, "publish": true},
    {"platform": "linux-x86_64", "runner": "ubuntu-24.04", "build": true, "publish": true},
    {"platform": "linux-aarch64", "runner": "ubuntu-24.04-arm", "build": true, "publish": true}
    ]

jobs:
  plan:
    name: Select platform rows
    # The dry run only; every other job of the dry run follows this one.
    if: github.event_name == 'workflow_dispatch' && inputs.version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.rows.outputs.build }}
    steps:
      # Its jobs build Windows only; a rehearsal proves the macOS rows.
      - name: Select the rows to build
        id: rows
        run: |
          echo "build=$(jq --compact-output '{include: map(select(.build and (.platform | startswith("windows-"))))}' <<< "$RELEASE_PLATFORMS")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      ORCHBEE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo --version

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Set up Inno Setup
        run: |
          $setupUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe'
          $setupSha256 = '4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.1.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'innosetup'
          curl.exe --fail --location --silent --show-error --ssl-revoke-best-effort --retry 5 --retry-all-errors $setupUrl --output $setup
          $actual = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          if ($actual -ne $setupSha256) { throw "Unexpected Inno Setup installer digest: $actual" }
          $unpack = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @('/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=`"$destination`"")
          if ($unpack.ExitCode -ne 0) { throw "Inno Setup unpacking exited $($unpack.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $destination 'ISCC.exe'))) { throw 'Inno Setup unpacked no ISCC.exe' }

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the test installer
        env:
          ORCHBEE_INNO_SETUP_COMPILER: ${{ runner.temp }}\innosetup\ISCC.exe
        run: pnpm desktop:installer:test --build-id "${{ github.sha }}.${{ github.run_number }}"

      - name: Collect the release artifacts
        run: node scripts/release-artifacts.mjs collect --profile test --output "$env:RUNNER_TEMP\release-artifacts"

      - name: Upload the release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-test-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts
          if-no-files-found: error
          # The release directory holds dot-named plugin folders, which the action skips by default.
          include-hidden-files: true
          retention-days: 3

  smoke:
    name: Smoke ${{ matrix.platform }} installer
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-test-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts

      - name: Check the release artifacts
        run: node scripts/release-artifacts.mjs check "$env:RUNNER_TEMP\release-artifacts"

      - name: Install silently
        run: node scripts/release-smoke-windows.mjs install "$env:RUNNER_TEMP\release-artifacts" --logs "$env:RUNNER_TEMP\smoke-logs"

      - name: Run the command from a new terminal
        run: node scripts/release-smoke-windows.mjs command "$env:RUNNER_TEMP\release-artifacts"

      - name: Uninstall silently
        run: node scripts/release-smoke-windows.mjs uninstall "$env:RUNNER_TEMP\release-artifacts" --logs "$env:RUNNER_TEMP\smoke-logs"

      - name: Scan for leftovers
        run: node scripts/release-smoke-windows.mjs leftovers "$env:RUNNER_TEMP\release-artifacts"

  smoke-npm:
    name: Smoke ${{ matrix.platform }} npm
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-test-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts

      - name: Check the release artifacts
        run: node scripts/release-artifacts.mjs check "$env:RUNNER_TEMP\release-artifacts"

      - name: Install, start and uninstall through npm
        run: node scripts/release-smoke-windows.mjs npm "$env:RUNNER_TEMP\release-artifacts" --prefix "$env:RUNNER_TEMP\npm-prefix"

      - name: Scan for leftovers
        run: node scripts/release-smoke-windows.mjs leftovers "$env:RUNNER_TEMP\release-artifacts"

  # The release path. Each job fails early and definitely; only `release-preconditions`,
  # `release-sign`, `release-feed` and `release-publish` use the environment `release`, and each maps
  # every secret into the one step that needs it.
  #
  # Whether the release path runs: a tag and a rehearsal always go on, and the dry run never does. A
  # candidate goes on only for the commit a passed Verify of a push checked, and only while no tag
  # has released the version that commit records: the commits between a release and the version
  # change after it would only rebuild a published version. It runs for every event, because a
  # skipped job skips every job after it.
  release-start:
    name: Release start
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CANDIDATE: >-
        ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha }}
    outputs:
      start: >-
        ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.version != '' ||
        steps.candidate.outputs.unreleased == 'true' }}
    steps:
      - name: Check out repository
        if: env.CANDIDATE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: env.CANDIDATE == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check that no tag released the recorded version
        id: candidate
        if: env.CANDIDATE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-publish.mjs candidate --repository "$GITHUB_REPOSITORY"

  release-plan:
    name: Release version
    needs: release-start
    if: needs.release-start.outputs.start == 'true'
    runs-on: ubuntu-latest
    # Waiting for an earlier run of the same commit takes up to an hour.
    timeout-minutes: 70
    permissions:
      # actions: read finds an earlier run to reuse.
      actions: read
      contents: read
    outputs:
      # The id of the passed run whose row files this run joins instead of building, or empty.
      reuse: ${{ steps.reuse.outputs.reuse }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      dist-tag: ${{ steps.plan.outputs.dist-tag }}
      # Every row; the Windows, the macOS and the Linux rows; whether there is a macOS or a Linux row.
      matrix: ${{ steps.plan.outputs.matrix }}
      windows-matrix: ${{ steps.plan.outputs.windows-matrix }}
      macos-matrix: ${{ steps.plan.outputs.macos-matrix }}
      macos: ${{ steps.plan.outputs.macos }}
      linux-matrix: ${{ steps.plan.outputs.linux-matrix }}
      linux: ${{ steps.plan.outputs.linux }}
      # Whether the release gate runs a path, and one row per older release it updates from.
      gate: ${{ steps.gate.outputs.gate }}
      gate-matrix: ${{ steps.gate.outputs.gate-matrix }}
      macos-gate: ${{ steps.gate.outputs.macos-gate }}
      macos-gate-matrix: ${{ steps.gate.outputs.macos-gate-matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Plan the release
        id: plan
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: node scripts/release-publish.mjs plan --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --version "$VERSION_INPUT"

      # A tag run's notes are its annotated message, read through the API because the checkout
      # drops tag annotations; a rehearsal needs none.
      - name: Read the release notes from the tag message
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: node scripts/release-publish.mjs notes --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

      - name: Check every version source against the version
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: node scripts/release-version.mjs check "$RELEASE_TAG"

      # Reads the published releases; a rehearsal selects the same paths as a tag would.
      - name: Select the release gate's paths
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          MACOS_AARCH64: ${{ steps.plan.outputs.macos-aarch64 }}
        run: node scripts/release-publish.mjs gate-paths --version "$RELEASE_VERSION" --repository "$GITHUB_REPOSITORY" --macos-aarch64 "$MACOS_AARCH64"

      - name: Find a passed run of this commit to reuse, or wait for one building it
        id: reuse
        if: inputs.rebuild != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          ROWS: ${{ steps.plan.outputs.matrix }}
        run: |
          platforms=$(jq -r '[.include[].platform] | join(",")' <<< "$ROWS")
          node scripts/release-publish.mjs reuse --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --platforms "$platforms" --repository "$GITHUB_REPOSITORY"

  release-preconditions:
    name: Release preconditions
    needs: release-plan
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # A tag run also needs the npm credential; a rehearsal never sees it.
      - name: Check the signing key, its trusted public half and the npm credential
        env:
          PUBLISH: ${{ needs.release-plan.outputs.publish }}
          ORCHBEE_RELEASE_SIGNING_KEY: ${{ secrets.ORCHBEE_RELEASE_SIGNING_KEY }}
          NPM_TOKEN: ${{ needs.release-plan.outputs.publish == 'true' && secrets.NPM_TOKEN || '' }}
        run: |
          npm_check=()
          if [ "$PUBLISH" = true ]; then npm_check=(--npm-token-env NPM_TOKEN); fi
          node scripts/release-publish.mjs preconditions --signing-key-env ORCHBEE_RELEASE_SIGNING_KEY "${npm_check[@]}"

  release-build:
    name: Release build ${{ matrix.platform }}
    needs: [release-plan, release-preconditions]
    if: needs.release-plan.outputs.reuse == ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.windows-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      ORCHBEE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo --version

      # Third-party crates, one entry per platform that this job and the platform's other build
      # share; see docs/VERIFICATION.md#ci-contract.
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Restore the Terminal Host build cache
        uses: ./.github/actions/terminal-host-build-cache
        with:
          entry: release

      - name: Stage the release cohort
        run: node scripts/stage-local-runtime.mjs --output "$env:RUNNER_TEMP\cohort" --artifact-stem orchbee

      # The release build keeps the platform's entries for later runs on main; a tag run reads them.
      - name: Save the Terminal Host build cache
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/terminal-host-build-cache
        with:
          entry: release
          save: 'true'

      - name: Describe the release cohort
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
          BUILD_ID: ${{ github.sha }}.${{ github.run_number }}
        run: node scripts/package-native-release.mjs "$env:RUNNER_TEMP\cohort" stable "$env:RELEASE_VERSION" "$env:BUILD_ID"

      - name: Upload the unsigned cohort
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cohort-${{ matrix.platform }}
          path: ${{ runner.temp }}\cohort
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      # The signing job receives only the manifest it signs.
      - name: Upload the manifest to sign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-${{ matrix.platform }}
          path: ${{ runner.temp }}\cohort\release.json
          if-no-files-found: error
          retention-days: 1

  # The Linux rows' `release-build`, in bash: every program linked statically against musl on a
  # runner of the row's architecture. Like Windows, the cohort carries no platform signature, so the
  # build describes it. The Linux jobs run only when the plan has a Linux row.
  release-build-linux:
    name: Release build ${{ matrix.platform }}
    needs: [release-plan, release-preconditions]
    if: needs.release-plan.outputs.linux == 'true' && needs.release-plan.outputs.reuse == ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.linux-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      ORCHBEE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Rust
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          rustup toolchain install --profile minimal
          # The row's musl standard library; the workspace builds no C code, so no musl C toolchain.
          rustup target add "${PLATFORM#linux-}-unknown-linux-musl"
          rustc --version
          cargo --version

      # Third-party crates, one entry per platform; see docs/VERIFICATION.md#ci-contract.
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      # Its own entry: the musl build shares nothing with Verify's builds on the same runner.
      - name: Restore the Terminal Host build cache
        uses: ./.github/actions/terminal-host-build-cache
        with:
          entry: release
          target: ${{ matrix.platform }}

      - name: Stage the release cohort
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/stage-local-runtime.mjs --output "$RUNNER_TEMP/cohort" --artifact-stem orchbee --platform "$PLATFORM"

      - name: Save the Terminal Host build cache
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/terminal-host-build-cache
        with:
          entry: release
          target: ${{ matrix.platform }}
          save: 'true'

      - name: Describe the release cohort
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
          BUILD_ID: ${{ github.sha }}.${{ github.run_number }}
        run: node scripts/package-native-release.mjs "$RUNNER_TEMP/cohort" stable "$RELEASE_VERSION" "$BUILD_ID" "$PLATFORM"

      - name: Upload the unsigned cohort
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cohort-${{ matrix.platform }}
          path: ${{ runner.temp }}/cohort
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Upload the manifest to sign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-${{ matrix.platform }}
          path: ${{ runner.temp }}/cohort/release.json
          if-no-files-found: error
          retention-days: 1

  # The macOS rows' `release-build`, in bash. The macOS jobs run only when the plan has a macOS
  # row, since a job with no row fails.
  release-build-macos:
    name: Release build ${{ matrix.platform }}
    needs: [release-plan, release-preconditions]
    if: needs.release-plan.outputs.macos == 'true' && needs.release-plan.outputs.reuse == ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos-matrix) }}
    runs-on: ${{ matrix.build-runner || matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      ORCHBEE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Rust
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          rustup toolchain install --profile minimal
          # The row's own standard library, which an Apple silicon build of an Intel row needs.
          rustup target add "$(if [ "$PLATFORM" = macos-x86_64 ]; then echo x86_64; else echo aarch64; fi)-apple-darwin"
          rustc --version
          cargo --version

      # Third-party crates, one entry per platform that this job and the platform's other build
      # share; see docs/VERIFICATION.md#ci-contract.
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Restore the Terminal Host build cache
        uses: ./.github/actions/terminal-host-build-cache
        with:
          entry: release
          target: ${{ matrix.platform }}

      - name: Stage the release cohort
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/stage-local-runtime.mjs --output "$RUNNER_TEMP/cohort" --artifact-stem orchbee --platform "$PLATFORM"

      # The release build keeps the platform's entries for later runs on main; a tag run reads them.
      - name: Save the Terminal Host build cache
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/terminal-host-build-cache
        with:
          entry: release
          target: ${{ matrix.platform }}
          save: 'true'

      - name: Upload the staged cohort
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cohort-unsigned-${{ matrix.platform }}
          path: ${{ runner.temp }}/cohort
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  # The manifest and each delivery route must bind the same Developer ID-signed programs.
  release-sign-native-macos:
    name: Developer ID sign native ${{ matrix.platform }}
    needs: [release-plan, release-build-macos]
    if: needs.release-plan.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos-matrix) }}
    environment: release
    runs-on: ${{ matrix.build-runner || matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the staged cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-cohort-unsigned-${{ matrix.platform }}
          path: ${{ runner.temp }}/cohort

      - name: Sign the programs with Developer ID
        env:
          PLATFORM: ${{ matrix.platform }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: node scripts/sign-macos-release.mjs native "$RUNNER_TEMP/cohort" "$PLATFORM"

      - name: Describe the signed release cohort
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
          BUILD_ID: ${{ github.sha }}.${{ github.run_number }}
        run: node scripts/package-native-release.mjs "$RUNNER_TEMP/cohort" stable "$RELEASE_VERSION" "$BUILD_ID" "$PLATFORM"

      - name: Upload the cohort for packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cohort-${{ matrix.platform }}
          path: ${{ runner.temp }}/cohort
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Upload the manifest to sign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-${{ matrix.platform }}
          path: ${{ runner.temp }}/cohort/release.json
          if-no-files-found: error
          retention-days: 1

  # Every row's manifest. A job the plan leaves out is skipped, and a skipped job of a planned
  # family stops the run here.
  release-sign:
    name: Release sign ${{ matrix.platform }}
    needs: [release-plan, release-build, release-sign-native-macos, release-build-linux]
    if: >-
      ${{ !cancelled() && needs.release-build.result == 'success' &&
      (needs.release-sign-native-macos.result == 'success' || needs.release-plan.outputs.macos == 'false') &&
      (needs.release-build-linux.result == 'success' || needs.release-plan.outputs.linux == 'false') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.matrix) }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest-${{ matrix.platform }}
          path: ${{ runner.temp }}/manifest

      # Node built-ins only; the key never leaves this step's environment.
      - name: Sign the manifest with the release key
        env:
          ORCHBEE_RELEASE_SIGNING_KEY: ${{ secrets.ORCHBEE_RELEASE_SIGNING_KEY }}
        run: node scripts/sign-release-manifest.mjs "$RUNNER_TEMP/manifest/release.json" --key-env ORCHBEE_RELEASE_SIGNING_KEY

      - name: Upload the signature
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-signature-${{ matrix.platform }}
          path: ${{ runner.temp }}/manifest/release.json.sig
          if-no-files-found: error
          retention-days: 1

  # From `release-sign` on, every job states the results it needs: GitHub's implied `success()`
  # also fails for a skipped ancestor, such as the macOS build of a run without macOS rows.
  release-package:
    name: Release package ${{ matrix.platform }}
    needs: [release-plan, release-sign]
    if: ${{ !cancelled() && needs.release-sign.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.windows-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The same pinned download as the dry run's build job.
      - name: Set up Inno Setup
        run: |
          $setupUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe'
          $setupSha256 = '4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.1.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'innosetup'
          curl.exe --fail --location --silent --show-error --ssl-revoke-best-effort --retry 5 --retry-all-errors $setupUrl --output $setup
          $actual = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          if ($actual -ne $setupSha256) { throw "Unexpected Inno Setup installer digest: $actual" }
          $unpack = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @('/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=`"$destination`"")
          if ($unpack.ExitCode -ne 0) { throw "Inno Setup unpacking exited $($unpack.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $destination 'ISCC.exe'))) { throw 'Inno Setup unpacked no ISCC.exe' }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the unsigned cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-cohort-${{ matrix.platform }}
          path: ${{ runner.temp }}\cohort

      - name: Download the signature beside it
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-signature-${{ matrix.platform }}
          path: ${{ runner.temp }}\cohort

      - name: Build the package inputs
        run: pnpm --filter @orchbee/desktop build:package-inputs

      - name: Build the release installer from the signed cohort
        env:
          ORCHBEE_INNO_SETUP_COMPILER: ${{ runner.temp }}\innosetup\ISCC.exe
        run: node apps/desktop/scripts/package.mjs --profile release --installer --cohort "$env:RUNNER_TEMP\cohort"

      - name: Collect the release artifacts
        run: node scripts/release-artifacts.mjs collect --profile release --output "$env:RUNNER_TEMP\release-artifacts"

      # A tag run keeps them long enough to run a failed publication again; another run keeps
      # every row's files a week, for a tag of the same commit to join the rows it publishes.
      - name: Upload the release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts
          if-no-files-found: error
          include-hidden-files: true
          # The release gate and join can start after a retry of the macOS notarization wait.
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 7 }}

      # The feed job receives only the feed document it signs. A tag run keeps it as long as the
      # release artifacts, so a failed feed job can run again.
      - name: Upload the feed to sign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-feed-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts\orchbee-${{ needs.release-plan.outputs.version }}-${{ matrix.platform }}.feed.json
          if-no-files-found: error
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 3 }}

  # Dependency installation and Electron assembly run in a job without signing credentials.
  release-assemble-macos:
    name: Release assemble ${{ matrix.platform }}
    needs: [release-plan, release-sign]
    if: ${{ !cancelled() && needs.release-plan.outputs.macos == 'true' && needs.release-sign.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos-matrix) }}
    runs-on: ${{ matrix.build-runner || matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the unsigned cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-cohort-${{ matrix.platform }}
          path: ${{ runner.temp }}/cohort

      - name: Download the signature beside it
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-signature-${{ matrix.platform }}
          path: ${{ runner.temp }}/cohort

      # Artifacts keep no file modes. The window launcher also runs from the bundled cohort.
      - name: Restore the programs' executable bit
        run: |
          for program in orchbee orchbee-server orchbee-worker orchbee-terminal-host orchbee-desktop-launcher; do
            chmod +x "$RUNNER_TEMP/cohort/$program"
          done

      - name: Build the package inputs
        run: pnpm --filter @orchbee/desktop build:package-inputs

      - name: Build the application from the signed cohort
        run: node apps/desktop/scripts/package.mjs --profile release --cohort "$RUNNER_TEMP/cohort"

      - name: Archive the application with its links and modes
        working-directory: apps/desktop/out/release
        run: tar -cf "$RUNNER_TEMP/macos-application.tar" -- *-darwin-*/Orchbee.app

      - name: Upload the application for signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-application-unsigned-${{ matrix.platform }}
          path: ${{ runner.temp }}/macos-application.tar
          if-no-files-found: error
          retention-days: 1

  # Only these steps receive the Apple credentials. Neither builds code nor installs dependencies.
  release-sign-desktop-macos:
    name: Developer ID sign and submit desktop ${{ matrix.platform }}
    needs: [release-plan, release-assemble-macos]
    if: ${{ !cancelled() && needs.release-assemble-macos.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos-matrix) }}
    environment: release
    runs-on: ${{ matrix.build-runner || matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ matrix.platform }}
      RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the application
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-application-unsigned-${{ matrix.platform }}
          path: ${{ runner.temp }}

      - name: Unpack the application
        run: |
          mkdir "$RUNNER_TEMP/desktop"
          tar -xpf "$RUNNER_TEMP/macos-application.tar" -C "$RUNNER_TEMP/desktop"

      - name: Sign the application and disk image with Developer ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: node scripts/sign-macos-release.mjs desktop "$RUNNER_TEMP/desktop" "$PLATFORM" "$RELEASE_VERSION"

      - name: Submit the disk image for notarization
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: node scripts/sign-macos-release.mjs submit "$RUNNER_TEMP/desktop" "$PLATFORM" "$RELEASE_VERSION"

      # Keep the exact signed bytes and Apple's submission ID together for a later wait.
      - name: Archive the submitted desktop package
        run: tar -cf "$RUNNER_TEMP/macos-desktop-submitted.tar" -C "$RUNNER_TEMP/desktop" .

      - name: Upload the submitted desktop package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-desktop-submitted-${{ matrix.platform }}
          path: ${{ runner.temp }}/macos-desktop-submitted.tar
          if-no-files-found: error
          retention-days: 3

  # A wait timeout leaves the submission with Apple. Re-running this job uses the same ID and
  # signed package, so retries can wait for and staple the original tickets.
  release-notarize-desktop-macos:
    name: Apple notarize desktop ${{ matrix.platform }}
    needs: [release-plan, release-sign-desktop-macos]
    if: ${{ !cancelled() && needs.release-sign-desktop-macos.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos-matrix) }}
    environment: release
    runs-on: ${{ matrix.build-runner || matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ matrix.platform }}
      RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the submitted desktop package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-desktop-submitted-${{ matrix.platform }}
          path: ${{ runner.temp }}

      - name: Unpack the submitted desktop package
        run: |
          mkdir "$RUNNER_TEMP/desktop"
          tar -xpf "$RUNNER_TEMP/macos-desktop-submitted.tar" -C "$RUNNER_TEMP/desktop"

      - name: Wait for Apple and staple the disk image and application
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: node scripts/sign-macos-release.mjs notarize "$RUNNER_TEMP/desktop" "$PLATFORM" "$RELEASE_VERSION"

      - name: Archive the notarized desktop package
        run: tar -cf "$RUNNER_TEMP/macos-desktop.tar" -C "$RUNNER_TEMP/desktop" .

      - name: Upload the notarized desktop package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-desktop-${{ matrix.platform }}
          path: ${{ runner.temp }}/macos-desktop.tar
          if-no-files-found: error
          retention-days: 3

  release-package-macos:
    name: Release package ${{ matrix.platform }}
    needs: [release-plan, release-notarize-desktop-macos]
    if: ${{ !cancelled() && needs.release-notarize-desktop-macos.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos-matrix) }}
    runs-on: ${{ matrix.build-runner || matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the notarized desktop package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-desktop-${{ matrix.platform }}
          path: ${{ runner.temp }}

      - name: Unpack the notarized desktop package
        run: |
          mkdir -p apps/desktop/out/release
          tar -xpf "$RUNNER_TEMP/macos-desktop.tar" -C apps/desktop/out/release

      - name: Collect the release artifacts
        run: node scripts/release-artifacts.mjs collect --profile release --output "$RUNNER_TEMP/release-artifacts"

      - name: Upload the release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-artifacts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 7 }}

      - name: Upload the feed to sign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-feed-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-artifacts/orchbee-${{ needs.release-plan.outputs.version }}-${{ matrix.platform }}.feed.json
          if-no-files-found: error
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 1 }}

  # The Linux rows have no window yet: the signed release directory alone makes the archive, the
  # feed and the npm packages.
  release-package-linux:
    name: Release package ${{ matrix.platform }}
    needs: [release-plan, release-sign]
    if: ${{ !cancelled() && needs.release-plan.outputs.linux == 'true' && needs.release-sign.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.linux-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # AppImage/type2-runtime publishes rolling builds only, so the runtime the AppImage starts with
      # is built here from this commit; its Docker build fetches libfuse and squashfuse by SHA-256.
      # apps/desktop/installer/linux/appimage-runtime-notices.txt reproduces what it links.
      TYPE2_RUNTIME_COMMIT: fedfad51acc2860b2916a1eef32ba4a500ff31ef
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # mksquashfs makes the AppImage's image; dpkg-deb comes with the runner.
      - name: Install squashfs-tools
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet --no-install-recommends squashfs-tools

      - name: Build the AppImage runtime
        run: |
          source="$RUNNER_TEMP/type2-runtime"
          git init --quiet "$source"
          git -C "$source" fetch --quiet --depth 1 https://github.com/AppImage/type2-runtime.git "$TYPE2_RUNTIME_COMMIT"
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          echo "https://github.com/AppImage/type2-runtime/commit/${TYPE2_RUNTIME_COMMIT:0:7}" > "$source/src/runtime/version"
          mkdir "$source/out"
          (cd "$source/out" && ARCH="$(uname -m)" bash ../scripts/docker/build-with-docker.sh)
          runtime="$source/out/runtime-$(uname -m)"
          test -f "$runtime"
          echo "ORCHBEE_APPIMAGE_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the unsigned cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-cohort-${{ matrix.platform }}
          path: ${{ runner.temp }}/cohort

      - name: Download the signature beside it
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-signature-${{ matrix.platform }}
          path: ${{ runner.temp }}/cohort

      # Artifacts keep no file modes. The window launcher also runs from the bundled cohort.
      - name: Restore the programs' executable bit
        run: |
          for program in orchbee orchbee-server orchbee-worker orchbee-terminal-host orchbee-desktop-launcher; do
            chmod +x "$RUNNER_TEMP/cohort/$program"
          done

      - name: Build the package inputs
        run: pnpm --filter @orchbee/desktop build:package-inputs

      - name: Build the release window, AppImage and Debian package from the signed cohort
        run: node apps/desktop/scripts/package.mjs --profile release --installer --cohort "$RUNNER_TEMP/cohort"

      - name: Collect the release artifacts
        run: node scripts/release-artifacts.mjs collect --profile release --output "$RUNNER_TEMP/release-artifacts"

      - name: Upload the release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-artifacts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 7 }}

      - name: Upload the feed to sign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-feed-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-artifacts/orchbee-${{ needs.release-plan.outputs.version }}-${{ matrix.platform }}.feed.json
          if-no-files-found: error
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 3 }}

  # Signs the update feed document and the release gate's copy of it, which names the archive by its
  # file name, for every row. Every release-path run signs, so a rehearsal proves this job before a
  # tag does. Like `release-sign`, it runs only scripts that use Node built-ins. Ed25519 is
  # deterministic, so a re-run writes the same signatures.
  release-feed:
    name: Release feed ${{ matrix.platform }}
    needs: [release-plan, release-package, release-package-macos, release-package-linux]
    if: >-
      ${{ !cancelled() && needs.release-package.result == 'success' &&
      (needs.release-package-macos.result == 'success' || needs.release-plan.outputs.macos == 'false') &&
      (needs.release-package-linux.result == 'success' || needs.release-plan.outputs.linux == 'false') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.matrix) }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FEED_NAME: orchbee-${{ needs.release-plan.outputs.version }}-${{ matrix.platform }}.feed.json
      GATE_FEED_NAME: orchbee-${{ needs.release-plan.outputs.version }}-${{ matrix.platform }}.gate.feed.json
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the feed
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-feed-${{ matrix.platform }}
          path: ${{ runner.temp }}/feed

      - name: Write the gate copy of the feed
        run: node scripts/release-feed.mjs gate "$RUNNER_TEMP/feed/$FEED_NAME"

      # The key reaches this step alone, by environment.
      - name: Sign the update feed and its gate copy with the release key
        env:
          ORCHBEE_RELEASE_SIGNING_KEY: ${{ secrets.ORCHBEE_RELEASE_SIGNING_KEY }}
        run: |
          node scripts/sign-release-manifest.mjs "$RUNNER_TEMP/feed/$FEED_NAME" --key-env ORCHBEE_RELEASE_SIGNING_KEY
          node scripts/sign-release-manifest.mjs "$RUNNER_TEMP/feed/$GATE_FEED_NAME" --key-env ORCHBEE_RELEASE_SIGNING_KEY

      # A tag run keeps both as long as the release artifacts, for a re-run of a later job; another
      # run keeps the feed signature as long as them, for a tag of the same commit to reuse.
      - name: Upload the feed signature
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-feed-signature-${{ matrix.platform }}
          path: ${{ runner.temp }}/feed/${{ env.FEED_NAME }}.sig
          if-no-files-found: error
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 7 }}

      - name: Upload the signed gate copy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-gate-feed-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/feed/${{ env.GATE_FEED_NAME }}
            ${{ runner.temp }}/feed/${{ env.GATE_FEED_NAME }}.sig
          if-no-files-found: error
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 1 }}

  release-smoke:
    name: Release smoke ${{ matrix.platform }} installer
    needs: [release-plan, release-package]
    if: ${{ !cancelled() && needs.release-package.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.windows-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts

      - name: Check the release artifacts
        run: node scripts/release-artifacts.mjs check "$env:RUNNER_TEMP\release-artifacts"

      - name: Install silently
        run: node scripts/release-smoke-windows.mjs install "$env:RUNNER_TEMP\release-artifacts" --logs "$env:RUNNER_TEMP\smoke-logs"

      - name: Run the command from a new terminal
        run: node scripts/release-smoke-windows.mjs command "$env:RUNNER_TEMP\release-artifacts"

      - name: Uninstall silently
        run: node scripts/release-smoke-windows.mjs uninstall "$env:RUNNER_TEMP\release-artifacts" --logs "$env:RUNNER_TEMP\smoke-logs"

      - name: Scan for leftovers
        run: node scripts/release-smoke-windows.mjs leftovers "$env:RUNNER_TEMP\release-artifacts"

  release-smoke-npm:
    name: Release smoke ${{ matrix.platform }} npm
    needs: [release-plan, release-package]
    if: ${{ !cancelled() && needs.release-package.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.windows-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ matrix.platform }}
          path: ${{ runner.temp }}\release-artifacts

      - name: Check the release artifacts
        run: node scripts/release-artifacts.mjs check "$env:RUNNER_TEMP\release-artifacts"

      - name: Install, start and uninstall through npm
        run: node scripts/release-smoke-windows.mjs npm "$env:RUNNER_TEMP\release-artifacts" --prefix "$env:RUNNER_TEMP\npm-prefix"

      - name: Scan for leftovers
        run: node scripts/release-smoke-windows.mjs leftovers "$env:RUNNER_TEMP\release-artifacts"

  # The macOS rows' smoke on fresh runners with those exact files: the disk image, the `.tar.gz`
  # through `orchbee install`, the website's install.sh with `--desktop` against a local copy of the
  # row's feed, and the npm route, each in its own scratch HOME.
  release-smoke-macos:
    name: Release smoke ${{ matrix.platform }}
    needs: [release-plan, release-package-macos]
    if: ${{ !cancelled() && needs.release-plan.outputs.macos == 'true' && needs.release-package-macos.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-artifacts

      - name: Check the release artifacts
        run: node scripts/release-artifacts.mjs check "$RUNNER_TEMP/release-artifacts"

      - name: Validate notarization tickets in the shipped files
        run: |
          artifacts="$RUNNER_TEMP/release-artifacts"
          xcrun stapler validate "$artifacts"/Orchbee-*.dmg
          mkdir "$RUNNER_TEMP/notarized-window"
          tar -xpf "$artifacts"/orchbee-desktop-*.zip -C "$RUNNER_TEMP/notarized-window"
          xcrun stapler validate "$RUNNER_TEMP/notarized-window"/*/Orchbee.app

      - name: Mount, verify and run the disk image
        run: node scripts/release-smoke-macos.mjs disk-image "$RUNNER_TEMP/release-artifacts" --work "$RUNNER_TEMP/smoke-disk-image"

      - name: Install and uninstall the archive
        run: node scripts/release-smoke-macos.mjs archive "$RUNNER_TEMP/release-artifacts" --work "$RUNNER_TEMP/smoke-archive"

      - name: Install the archive and the desktop app through install.sh
        run: node scripts/release-smoke-macos.mjs install-script "$RUNNER_TEMP/release-artifacts" --work "$RUNNER_TEMP/smoke-install-script"

      - name: Install, start and uninstall through npm
        run: node scripts/release-smoke-macos.mjs npm "$RUNNER_TEMP/release-artifacts" --work "$RUNNER_TEMP/smoke-npm"

  # The Linux rows' smoke on fresh runners with those exact files: the `.tar.gz` through
  # `orchbee install`, the website's install.sh with `--desktop` against a local copy of the row's
  # feed, the AppImage's and the Debian package's contents, and the npm route, each in its own
  # scratch HOME.
  release-smoke-linux:
    name: Release smoke ${{ matrix.platform }}
    needs: [release-plan, release-package-linux]
    if: ${{ !cancelled() && needs.release-plan.outputs.linux == 'true' && needs.release-package-linux.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.linux-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-artifacts

      - name: Check the release artifacts
        run: node scripts/release-artifacts.mjs check "$RUNNER_TEMP/release-artifacts"

      - name: Install and uninstall the archive
        run: node scripts/release-smoke-linux.mjs archive "$RUNNER_TEMP/release-artifacts" --work "$RUNNER_TEMP/smoke-archive"

      - name: Install the archive and the desktop app through install.sh
        run: node scripts/release-smoke-linux.mjs install-script "$RUNNER_TEMP/release-artifacts" --work "$RUNNER_TEMP/smoke-install-script"

      - name: Check the AppImage and the Debian package
        run: node scripts/release-smoke-linux.mjs packages "$RUNNER_TEMP/release-artifacts" --work "$RUNNER_TEMP/smoke-packages"

      - name: Install, start and uninstall through npm
        run: node scripts/release-smoke-linux.mjs npm "$RUNNER_TEMP/release-artifacts" --work "$RUNNER_TEMP/smoke-npm"

  # The real-window Update check (scripts/release-window-update.mjs) beside the release build, from
  # the plan on: a Test window built here, because a release build never opens the DevTools port the
  # check drives, and two older stand-ins copied from it, in a scratch store root and data root.
  # Nothing is downloaded but the toolchains. A failure keeps the page's screenshot and DOM and the
  # data root's logs for three days and stops the release before Publish.
  release-window-update:
    name: Release window Update ${{ matrix.platform }}
    needs: release-plan
    if: needs.release-plan.outputs.reuse == ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.windows-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      ORCHBEE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo --version

      # Third-party crates, one entry per platform that this job and the platform's other build
      # share; see docs/VERIFICATION.md#ci-contract.
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.platform }}
          save-if: false

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Restore the Terminal Host build cache
        uses: ./.github/actions/terminal-host-build-cache
        with:
          entry: release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Test window
        run: pnpm desktop:package:test --build-id "${{ github.sha }}.${{ github.run_number }}"

      # The work folder lies in the profile, as a person's data root does.
      - name: Press Update in the real window
        run: |
          $windows = @(Get-ChildItem -LiteralPath 'apps\desktop\out\test' -Directory)
          if ($windows.Count -ne 1) { throw "apps\desktop\out\test holds $($windows.Count) folders, not one packaged window" }
          node scripts/release-smoke-windows.mjs window-update $windows[0].FullName --work "$env:USERPROFILE\window-update" --diagnostics "$env:RUNNER_TEMP\window-update-diagnostics"

      - name: Keep the diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-window-update-${{ matrix.platform }}
          path: ${{ runner.temp }}\window-update-diagnostics
          if-no-files-found: ignore
          retention-days: 3

  # The macOS rows' real-window Update check, in bash, as on Windows.
  release-window-update-macos:
    name: Release window Update ${{ matrix.platform }}
    needs: release-plan
    if: needs.release-plan.outputs.macos == 'true' && needs.release-plan.outputs.reuse == ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      ORCHBEE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo --version

      # Third-party crates, one entry per platform and runner. A row whose build runs on its own
      # runner shares the build's entry; a row with a `build-runner` keeps its own from here.
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.build-runner != null }}

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Restore the Terminal Host build cache
        uses: ./.github/actions/terminal-host-build-cache
        with:
          entry: release
          target: ${{ matrix.platform }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Test window
        run: pnpm desktop:package:test --build-id "${{ github.sha }}.${{ github.run_number }}"

      - name: Save the Terminal Host build cache
        if: github.ref == 'refs/heads/main' && matrix.build-runner != null
        uses: ./.github/actions/terminal-host-build-cache
        with:
          entry: release
          target: ${{ matrix.platform }}
          save: 'true'

      - name: Press Update in the real window
        run: |
          shopt -s nullglob
          windows=(apps/desktop/out/test/*/)
          if [ "${#windows[@]}" -ne 1 ]; then echo "apps/desktop/out/test holds ${#windows[@]} folders, not one packaged window" >&2; exit 1; fi
          node scripts/release-smoke-macos.mjs window-update "$PWD/${windows[0]%/}" --work "$RUNNER_TEMP/window-update" --diagnostics "$RUNNER_TEMP/window-update-diagnostics"

      - name: Keep the diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-window-update-${{ matrix.platform }}
          path: ${{ runner.temp }}/window-update-diagnostics
          if-no-files-found: ignore
          retention-days: 3

  # The Linux rows' real-window Update check, in bash on a virtual display, as on macOS.
  release-window-update-linux:
    name: Release window Update ${{ matrix.platform }}
    needs: release-plan
    if: needs.release-plan.outputs.linux == 'true' && needs.release-plan.outputs.reuse == ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.linux-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      ORCHBEE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo --version

      # Third-party crates of the runner's own target, an entry apart from the musl release build's.
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-window-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Zig
        uses: ./.github/actions/zig

      - name: Fetch the Zig packages
        uses: ./.github/actions/zig-packages

      - name: Restore the Terminal Host build cache
        uses: ./.github/actions/terminal-host-build-cache
        with:
          entry: release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Test window
        run: pnpm desktop:package:test --build-id "${{ github.sha }}.${{ github.run_number }}"

      - name: Press Update in the real window
        run: |
          shopt -s nullglob
          windows=(apps/desktop/out/test/*/)
          if [ "${#windows[@]}" -ne 1 ]; then echo "apps/desktop/out/test holds ${#windows[@]} folders, not one packaged window" >&2; exit 1; fi
          xvfb-run --auto-servernum node scripts/release-smoke-linux.mjs window-update "$PWD/${windows[0]%/}" --work "$RUNNER_TEMP/window-update" --diagnostics "$RUNNER_TEMP/window-update-diagnostics"

      - name: Keep the diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-window-update-${{ matrix.platform }}
          path: ${{ runner.temp }}/window-update-diagnostics
          if-no-files-found: ignore
          retention-days: 3

  # One path of the release gate per older release the plan selected, on a fresh runner, from that
  # release's published assets to this run's Windows archive and signed gate feed, brought over as
  # the row's mode says (idle move, restart, or cold adoption). With no path selected the job is
  # skipped, since a job with no row fails, and `release-publish` goes on; a failed path stops the
  # release before Publish. A rehearsal runs the same paths.
  release-gate:
    name: Release gate from ${{ matrix.older }}
    needs: [release-plan, release-feed]
    if: ${{ !cancelled() && needs.release-plan.outputs.gate == 'true' && needs.release-feed.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.gate-matrix) }}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-windows-x86_64
          path: ${{ runner.temp }}\gate

      # The gate copy names the archive by its file name, so it goes beside it.
      - name: Download the signed gate feed beside them
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-gate-feed-windows-x86_64
          path: ${{ runner.temp }}\gate

      # The gate's one platform is the one scripts/release-smoke-windows.mjs updates.
      - name: Update from ${{ matrix.older }} while a terminal keeps running
        env:
          OLDER: ${{ matrix.older }}
          MODE: ${{ matrix.mode }}
          GATE_FEED: ${{ runner.temp }}\gate\orchbee-${{ needs.release-plan.outputs.version }}-windows-x86_64.gate.feed.json
        run: node scripts/release-smoke-windows.mjs gate $env:OLDER --release "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$env:OLDER/" --feed "$env:GATE_FEED" --work "$env:RUNNER_TEMP\gate-work" --mode $env:MODE

  # The Apple silicon pre-publish gate path from the newest published macOS release to this run's
  # `macos-aarch64` runtime and window archives. Skipped when no macOS row is planned or no older
  # macOS release exists yet; a failed path stops publication before GitHub Release or npm moves.
  release-gate-macos:
    name: Release gate macos-aarch64 from ${{ matrix.older }}
    needs: [release-plan, release-feed]
    if: ${{ !cancelled() && needs.release-plan.outputs.macos-gate == 'true' && needs.release-feed.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos-gate-matrix) }}
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-macos-aarch64
          path: ${{ runner.temp }}/gate

      # The gate copy names the archive and window archive by file name, so it goes beside them.
      - name: Download the signed gate feed beside them
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-gate-feed-macos-aarch64
          path: ${{ runner.temp }}/gate

      - name: Update from ${{ matrix.older }} while a terminal keeps running
        env:
          OLDER: ${{ matrix.older }}
          MODE: ${{ matrix.mode }}
          GATE_FEED: ${{ runner.temp }}/gate/orchbee-${{ needs.release-plan.outputs.version }}-macos-aarch64.gate.feed.json
        run: node scripts/release-smoke-macos.mjs gate "$OLDER" --release "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$OLDER/" --feed "$GATE_FEED" --work "$RUNNER_TEMP/gate-work" --mode "$MODE"

  # Joins every row's artifacts, each with the feed signature `release-feed` made beside its feed,
  # into the one set `release-publish` publishes: one row unchanged, several with one main npm
  # package listing every row's platform package and one SHA256SUMS. A rehearsal runs it too, so it
  # proves the set a tag with the same rows publishes. No secret, no environment.
  # Joins this run's rows, or, in a run that reuses another, the files of this run's rows from that
  # run, whose builds, smoke tests, window Updates and gate paths passed; it checks every row again
  # either way.
  release-join:
    name: ${{ needs.release-plan.outputs.reuse != '' && format('Release join from run {0}', needs.release-plan.outputs.reuse) || 'Release join' }}
    needs: [release-plan, release-preconditions, release-feed]
    if: >-
      ${{ !cancelled() && (needs.release-feed.result == 'success' ||
      needs.release-plan.outputs.reuse != '' && needs.release-preconditions.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # actions: read downloads the files of the run this one reuses.
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-assets-*
          path: ${{ runner.temp }}/release
          run-id: ${{ needs.release-plan.outputs.reuse || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download the feed signatures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-feed-signature-*
          path: ${{ runner.temp }}/feed-signatures
          run-id: ${{ needs.release-plan.outputs.reuse || github.run_id }}
          github-token: ${{ github.token }}

      # Every row of this run's plan, each checked with its signature beside the feed; SHA256SUMS
      # does not list the signature. A reused run's other rows stay out.
      - name: Check every row and join them
        env:
          ROWS: ${{ needs.release-plan.outputs.matrix }}
        run: |
          rows=()
          for platform in $(jq -r '.include[].platform' <<< "$ROWS"); do
            row="$RUNNER_TEMP/release/release-assets-$platform"
            cp "$RUNNER_TEMP/feed-signatures/release-feed-signature-$platform/"*.feed.json.sig "$row/"
            node scripts/release-artifacts.mjs check "$row"
            rows+=("$row")
          done
          node scripts/release-artifacts.mjs join --output "$RUNNER_TEMP/release-joined" "${rows[@]}"

      # A tag run keeps it as long as the row artifacts, for a re-run of the publication; a tag of
      # the same commit joins its own rows again, so another run keeps it a day.
      - name: Upload the joined release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-joined
          path: ${{ runner.temp }}/release-joined
          if-no-files-found: error
          include-hidden-files: true
          retention-days: ${{ needs.release-plan.outputs.publish == 'true' && 14 || 1 }}

  # Tag runs only: waits, beside the build, until Verify passed for the tagged commit; the Verify
  # run on main that checks the commit is the merge gate the release stands on.
  release-verified:
    name: Verify passed for ${{ needs.release-plan.outputs.tag }}
    needs: release-plan
    if: github.event_name == 'push' && needs.release-plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Wait for Verify on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
        run: node scripts/release-publish.mjs verified --commit "$GITHUB_SHA" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

  # Tag runs only, with no approval: cancelling the run before this job starts is the way to stop a
  # release. GitHub first, as a draft; then npm, because a published npm version can never be
  # replaced; then the draft becomes the Latest release, so a failed npm step leaves it a draft.
  # Run again, the job finishes a partial publication. The condition names the `push` event as well
  # as the plan's `publish`, so no manual run reaches it. Verify must have passed for the commit and
  # the join, and unless the run reuses another, every needed job must have passed: the macOS smoke
  # and window Update check may be skipped only when the plan has no macOS row, the Linux smoke and
  # window Update check only when it has no Linux row, and the release gate only when the plan
  # selected no path.
  release-publish:
    name: Publish ${{ needs.release-plan.outputs.tag }}
    needs:
      [
        release-plan,
        release-join,
        release-smoke,
        release-smoke-npm,
        release-smoke-macos,
        release-smoke-linux,
        release-window-update,
        release-window-update-macos,
        release-window-update-linux,
        release-gate,
        release-gate-macos,
        release-verified,
      ]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.release-plan.outputs.publish == 'true' &&
      needs.release-verified.result == 'success' &&
      needs.release-join.result == 'success' && (needs.release-plan.outputs.reuse != '' ||
      needs.release-smoke.result == 'success' &&
      needs.release-smoke-npm.result == 'success' &&
      (needs.release-smoke-macos.result == 'success' || needs.release-plan.outputs.macos == 'false') &&
      (needs.release-smoke-linux.result == 'success' || needs.release-plan.outputs.linux == 'false') &&
      needs.release-window-update.result == 'success' &&
      (needs.release-window-update-macos.result == 'success' || needs.release-plan.outputs.macos == 'false') &&
      (needs.release-window-update-linux.result == 'success' || needs.release-plan.outputs.linux == 'false') &&
      (needs.release-gate.result == 'success' || needs.release-plan.outputs.gate == 'false') &&
      (needs.release-gate-macos.result == 'success' || needs.release-plan.outputs.macos-gate == 'false')) }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # actions: write lets the token dispatch the Update check.
      actions: write
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Name the artifacts directory
        run: echo "ARTIFACTS=$RUNNER_TEMP/release" >> "$GITHUB_ENV"

      # registry-url makes npm read its credential from NODE_AUTH_TOKEN, set only in the npm step.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The joined set, every feed signature `release-feed` made beside its feed.
      - name: Download the joined release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-joined
          path: ${{ runner.temp }}/release

      # Also verifies each feed signature with RELEASE_KEYS and each feed against its archive.
      - name: Check the release artifacts
        run: node scripts/release-artifacts.mjs check "$ARTIFACTS"

      - name: Create or complete the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-publish.mjs github "$ARTIFACTS" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

      # Trusted publishing later replaces the token: drop NODE_AUTH_TOKEN here and the npm check of
      # release-preconditions; see docs/RELEASING.md.
      - name: Publish the npm packages, platform packages first
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-publish.mjs npm "$ARTIFACTS" --version "$RELEASE_VERSION" --repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

      - name: Publish the draft as the Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-publish.mjs publish "$ARTIFACTS" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

      # A release published with this job's token raises no `release: published` run, but the token
      # may dispatch a workflow.
      - name: Start the Update check
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-check.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$RELEASE_TAG"
