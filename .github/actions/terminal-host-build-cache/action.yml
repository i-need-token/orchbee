name: Terminal Host build cache
description: >-
  Restores, or with `save: 'true'` saves, the Zig caches that a Terminal Host build fills: the
  release build of the Rust test preparation (apps/terminal-host/scripts/build-host.mjs), with
  `entry: test` the Terminal Host's own test builds, or with `entry: release` the release
  workflow's staging builds (scripts/stage-local-runtime.mjs) of the release and Test identities. Zig checks every cached result against the
  content of its inputs, so an entry never makes a build use stale code; the key only decides how
  much an entry still saves. Run it after `zig-packages`, whose package archives under the global
  cache's `p` stay that action's own entry.

inputs:
  entry:
    description: "'build' for the Rust test preparation's build, 'test' for the Terminal Host tests, 'release' for the release workflow's staging builds"
    required: false
    default: build
  target:
    description: "The release platform a build targets when the runner's own platform does not say it, such as an Intel build on Apple silicon"
    required: false
    default: ''
  save:
    description: "'true' saves the caches unless this run restored them under the exact key"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Locate the Zig build caches
      id: paths
      shell: bash
      env:
        ENTRY: ${{ inputs.entry }}
      run: |
        case "$ENTRY" in build | test | release) ;; *) echo "Unknown Terminal Host cache entry: $ENTRY" >&2; exit 1 ;; esac
        if [ "$RUNNER_OS" = Windows ]; then global="$LOCALAPPDATA\\zig"; else global="${XDG_CACHE_HOME:-$HOME/.cache}/zig"; fi
        {
          echo 'paths<<ORCHBEE_PATHS'
          echo 'apps/terminal-host/.zig-cache'
          echo "$global/o"
          echo "$global/h"
          echo "$global/z"
          echo 'ORCHBEE_PATHS'
        } >> "$GITHUB_OUTPUT"

    # The prefix holds the compiler and the pinned packages, so an entry starts empty when either
    # changes; within one prefix a source change restores the newest entry and rebuilds only what
    # changed, and the entry it saves keeps what that build added.
    - name: Restore the Zig build caches
      id: restore
      if: inputs.save != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: terminal-host-${{ inputs.entry }}${{ inputs.target != '' && format('-{0}', inputs.target) || '' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/zig/action.yml', 'apps/terminal-host/build.zig.zon') }}-${{ hashFiles('apps/terminal-host/build.zig', 'apps/terminal-host/build/**', 'apps/terminal-host/src/**', 'apps/terminal-host/scripts/**', 'scripts/stage-native-windows.mjs') }}
        restore-keys: |
          terminal-host-${{ inputs.entry }}${{ inputs.target != '' && format('-{0}', inputs.target) || '' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/zig/action.yml', 'apps/terminal-host/build.zig.zon') }}-

    - name: Remember the restored key
      if: inputs.save != 'true'
      shell: bash
      env:
        PRIMARY_KEY: ${{ steps.restore.outputs.cache-primary-key }}
        EXACT_HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        echo "ORCHBEE_TERMINAL_HOST_BUILD_KEY=$PRIMARY_KEY" >> "$GITHUB_ENV"
        echo "ORCHBEE_TERMINAL_HOST_BUILD_HIT=$EXACT_HIT" >> "$GITHUB_ENV"

    # Entries accumulate within one prefix; past the bound the entry is left unsaved, and the next
    # compiler or package change starts a fresh one.
    - name: Measure the Zig build caches
      id: size
      if: inputs.save == 'true' && env.ORCHBEE_TERMINAL_HOST_BUILD_HIT != 'true'
      shell: bash
      env:
        CACHE_PATHS: ${{ steps.paths.outputs.paths }}
      run: |
        total=0
        while IFS= read -r directory; do
          if [ -d "$directory" ]; then total=$((total + $(du -sk "$directory" | cut -f1))); fi
        done <<< "$CACHE_PATHS"
        echo "Zig build caches: $((total / 1024)) MiB"
        if [ "$total" -le $((2560 * 1024)) ]; then echo "fits=true" >> "$GITHUB_OUTPUT"; else echo "::notice title=Zig build cache not saved::$((total / 1024)) MiB exceeds the 2560 MiB bound"; fi

    - name: Save the Zig build caches
      if: steps.size.outputs.fits == 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: ${{ env.ORCHBEE_TERMINAL_HOST_BUILD_KEY }}
