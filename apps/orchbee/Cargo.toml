[package]
autotests = false
name = "orchbee"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
base64.workspace = true
getrandom.workspace = true
# Client runtime behind the command and terminal-shell entry layers.
orchbee-workbench-client = { path = "crates/workbench-client" }
orchbee-local-ipc = { path = "../../crates/local-ipc" }
orchbee-local-runtime = { path = "../../crates/local-runtime" }
crossterm.workspace = true
# Integration requests and reports exchanged with the Session Worker.
orchbee-agent-integration = { path = "../../crates/agent-integration" }
# Read-only provider configuration helpers for offline `agent doctor` and update verification.
orchbee-agent-integration-writer = { path = "../../crates/agent-integration-writer" }
orchbee-agent-observation-protocol = { path = "../../crates/agent-observation-protocol" }
orchbee-client-server-protocol = { path = "../../crates/client-server-protocol" }
orchbee-terminal-protocol = { path = "../../crates/terminal-protocol" }
orchbee-local-client-protocol = { path = "../../crates/local-client-protocol" }
orchbee-workbench-protocol = { path = "../../crates/workbench-protocol" }
ratatui.workspace = true
# Release installation and `agent doctor` digests are canonical sha256.
sha2.workspace = true
unicode-segmentation.workspace = true

# `terminal wait-output --regex`: linear-time engine compiled once at parse;
# the builder pins compiled-program and DFA cache budgets.
regex.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["dir", "fs", "poll", "signal", "user"] }

[target.'cfg(windows)'.dependencies]
# System-directory lookup for the owned, cancellable stdin reader and command routing.
winsafe = { workspace = true, features = ["kernel"] }
winapi-util.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["signal"] }

[dev-dependencies]
# Shared GUI/TUI close-target corpus; reuse the already admitted workspace serde.
jsonschema.workspace = true
# Bounded fake peers, controlled transport clocks, and Client runtime fixtures for application
# tests only.
orchbee-workbench-client = { path = "crates/workbench-client", features = ["test-support"] }
# Frozen provider fixture packs replayed against the CLI's integration exit mapping.
orchbee-agent-integration-writer = { path = "../../crates/agent-integration-writer", features = [
	"test-support",
] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs", "process", "signal", "term"] }
rustix = { workspace = true, features = ["fs", "termios"] }

[target.'cfg(windows)'.dev-dependencies]
# Default configuration and provider TOML documents are parsed and rendered in Windows tests.
toml.workspace = true
toml_edit.workspace = true

[lints]
workspace = true
[target.'cfg(target_os = "linux")'.dev-dependencies]
orchbee-capability-node-protocol = { path = "../../crates/capability-node-protocol" }
orchbee-local-worker-protocol = { path = "../../crates/local-worker-protocol" }
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

# Keep the inherited SIGTERM-mask witness in its own process.
[[test]]
name = "cli_agent"
path = "tests/cli_agent.rs"

# Keep STAGE_SERIAL staging/spawn/cleanup isolation from other suites.
[[test]]
name = "cli_control_grammar"
path = "tests/cli_control_grammar.rs"

# Keep this suite's LIVE_FIXTURES admission and exclusive deadlines isolated.
[[test]]
name = "cli_windows_agent_focus"
path = "tests/cli_windows_agent_focus.rs"

# Keep this suite's LIVE_FIXTURES admission and exclusive deadlines isolated.
[[test]]
name = "cli_windows_agent_names"
path = "tests/cli_windows_agent_names.rs"

# Keep this suite's LIVE_FIXTURES admission and exclusive deadlines isolated.
[[test]]
name = "cli_windows_creation"
path = "tests/cli_windows_creation.rs"

# Keep this real Session's 35-second hold and process load away from aggregate suite deadlines.
[[test]]
name = "cli_windows_worktree_removal"
path = "tests/cli_windows_worktree_removal.rs"

# Keep these two real Sessions, their TUI Client and background output away from aggregate suite
# deadlines.
[[test]]
name = "cli_windows_plugin_popup_session"
path = "tests/cli_windows_plugin_popup_session.rs"

# Keep these two real Sessions, their TUI Client, timed pointer input and background output away
# from aggregate suite deadlines.
[[test]]
name = "cli_windows_terminal_viewer_session"
path = "tests/cli_windows_terminal_viewer_session.rs"

# Keep these two real Sessions, their TUI Client, the renaming Client and background output away
# from aggregate suite deadlines; the run takes about two minutes of real input timing.
[[test]]
name = "cli_windows_client_under_commits"
path = "tests/cli_windows_client_under_commits.rs"

# Keep these two real Sessions, their TUI Client, timed pointer and key input and background output
# away from aggregate suite deadlines.
[[test]]
name = "cli_windows_switch_keys"
path = "tests/cli_windows_switch_keys.rs"

# Keep these two real Sessions, their TUI Client and the sampled directory changes away from
# aggregate suite deadlines.
[[test]]
name = "cli_windows_workspace_naming"
path = "tests/cli_windows_workspace_naming.rs"

# Keep these two real Sessions, their TUI Client, timed pointer input and real Git operations away
# from aggregate suite deadlines.
[[test]]
name = "cli_windows_worktree_menu"
path = "tests/cli_windows_worktree_menu.rs"

# Keep these two real Sessions, their TUI Client and the sampled Agent states away from aggregate
# suite deadlines.
[[test]]
name = "cli_windows_agent_sidebar"
path = "tests/cli_windows_agent_sidebar.rs"

# Keep these two real Sessions, their TUI Client and timed pointer input away from aggregate suite
# deadlines.
[[test]]
name = "cli_windows_idle_close"
path = "tests/cli_windows_idle_close.rs"

# Keep these two real Sessions, their TUI Client and six real shells away from aggregate suite
# deadlines.
[[test]]
name = "cli_windows_zoom_close"
path = "tests/cli_windows_zoom_close.rs"

# Keep these real Sessions, their repeated restarts, stub Agents and pinned-ConPTY prerequisite away
# from aggregate suite deadlines.
[[test]]
name = "cli_windows_agent_resume"
path = "tests/cli_windows_agent_resume.rs"

# Keep short-deadline PROCESS_WITNESS_LOCK scheduling isolated.
[[test]]
name = "local_startup_process"
path = "tests/local_startup_process.rs"

# Keep its independent short-deadline PROCESS_WITNESS_LOCK isolated.
[[test]]
name = "native_publication_refresh"
path = "tests/native_publication_refresh.rs"
