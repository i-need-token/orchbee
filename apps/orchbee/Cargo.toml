[package]
autotests = false
name = "orchbee"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
base64.workspace = true
getrandom.workspace = true
# Client runtime behind the command and terminal-shell entry layers.
orchbee-workbench-client = { path = "crates/workbench-client" }
orchbee-local-ipc = { path = "../../crates/local-ipc" }
orchbee-local-runtime = { path = "../../crates/local-runtime" }
crossterm.workspace = true
# Integration requests and reports exchanged with the Session Worker.
orchbee-agent-integration = { path = "../../crates/agent-integration" }
# Provider configuration helpers for update verification and the disable `uninstall` runs after
# every Session has stopped.
orchbee-agent-integration-writer = { path = "../../crates/agent-integration-writer" }
orchbee-agent-observation-protocol = { path = "../../crates/agent-observation-protocol" }
orchbee-client-server-protocol = { path = "../../crates/client-server-protocol" }
orchbee-terminal-protocol = { path = "../../crates/terminal-protocol" }
orchbee-local-client-protocol = { path = "../../crates/local-client-protocol" }
# Release manifests, signature documents and the store pointer share one strict grammar.
orchbee-release-records = { path = "../../crates/release-records" }
# Handshake refusals and Session process queries the CLI reports.
orchbee-connection-handshake = { path = "../../crates/connection-handshake" }
# The `machine-link` connection the remote helper `--machine-link` accepts.
orchbee-machine-protocol = { path = "../../crates/machine-protocol" }
orchbee-workbench-protocol = { path = "../../crates/workbench-protocol" }
ratatui.workspace = true
# Release installation digests are canonical sha256.
sha2.workspace = true
# Release manifest signatures: Ed25519 verification only, without precomputed tables or zeroizing
# key types, since the updater holds no private key.
ed25519-dalek = { version = "2.2.0", default-features = false }
unicode-segmentation.workspace = true

# `terminal wait-output --regex`: linear-time engine compiled once at parse;
# the builder pins compiled-program and DFA cache budgets.
regex.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }

[target.'cfg(unix)'.dependencies]
# `term`: the echo-free terminal read of a `machine connect` question; `socket`: a stream-socket
# `--stdin`, such as the socket pair Node.js gives a child process.
nix = { workspace = true, features = ["dir", "fs", "poll", "signal", "socket", "term", "user"] }

[target.'cfg(windows)'.dependencies]
# System-directory lookup for the owned, cancellable stdin reader and command routing, and the
# user `Path` registry value of the release PATH step.
winsafe = { workspace = true, features = ["advapi", "kernel"] }
winapi-util.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["signal"] }

# The kqueue that wakes the CLI's signal capture; `resource`: the open-descriptor limit a window
# version's install raises.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["event", "resource"] }

[dev-dependencies]
# Shared GUI/TUI close-target corpus; reuse the already admitted workspace serde.
jsonschema.workspace = true
# Bounded fake peers, controlled transport clocks, and Client runtime fixtures for application
# tests only.
orchbee-workbench-client = { path = "crates/workbench-client", features = ["test-support"] }
# Default configuration and provider TOML documents are parsed and rendered in tests.
toml.workspace = true
toml_edit.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# `socket` lets a scripted peer look at a connection's first frame without taking it from the script.
nix = { workspace = true, features = ["fs", "process", "signal", "socket", "term"] }

[target.'cfg(windows)'.dev-dependencies]
# The workspace's Job wrapper, already admitted, gives the link helper's process test a Job with the
# limits Win32-OpenSSH gives each connection.
process-wrap.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

# Keep STAGE_SERIAL staging/spawn/cleanup isolation from other suites.
[[test]]
name = "cli_control_grammar"
path = "tests/cli_control_grammar.rs"

# Keep this suite's LIVE_FIXTURES admission and exclusive deadlines isolated.
[[test]]
name = "cli_windows_agent_focus"
path = "tests/cli_windows_agent_focus.rs"

# Keep this suite's LIVE_FIXTURES admission and exclusive deadlines isolated.
[[test]]
