[package]
name = "orchbee"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
getrandom.workspace = true
orchbee-local-ipc = { path = "../../crates/local-ipc" }


orchbee-local-site-runtime = { path = "../../crates/local-site-runtime" }
crossterm = { version = "0.29.0", default-features = false }
orchbee-agent-observation-protocol = { path = "../../crates/agent-observation-protocol" }
orchbee-client-server-protocol = { path = "../../crates/client-server-protocol" }
orchbee-terminal-protocol = { path = "../../crates/terminal-protocol" }
orchbee-local-client-protocol = { path = "../../crates/local-client-protocol" }
orchbee-workbench-protocol = { path = "../../crates/workbench-protocol" }
ratatui = { version = "0.30.2", default-features = false, features = [
	"std",
	"unstable-rendered-line-info",
] }
# Provider onboarding: capsule payload digests are canonical sha256.
sha2.workspace = true
unicode-segmentation = { version = "1.13.3", default-features = false }

# `terminal wait-output --regex`: linear-time engine compiled once at parse;
# the builder pins compiled-program and DFA cache budgets.
regex.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["dir", "fs", "poll", "signal", "user"] }
rustix = { workspace = true, features = ["fs", "termios"] }
signal-hook = { version = "0.3.18", default-features = false }

[target.'cfg(windows)'.dependencies]
# Owned Unicode clipboard writes through a hidden HWND; no reads or monitoring.
clipboard-win = { version = "5.4.1", default-features = false, features = ["std"] }
# Exact retained console handles provide raw input records, mode and window
# observation, and count-aware UTF-16 output without process-global reopening.
orchbee-windows-console-host = { path = "../../crates/windows-console-host" }
# Original console-title capture/restoration through safe UTF-16 Windows wrappers.
win32console.workspace = true
base64.workspace = true
# Closed Windows remote CLI relay envelopes; reuse the workspace-pinned serde.
serde.workspace = true
serde_core = { version = "1.0.229", default-features = false, features = ["std"] }
# Complete, bounded provider-owned TOML configuration inspection.
toml.workspace = true
# Syntax-preserving provider TOML hook editing; Windows integration owner.
toml_edit.workspace = true
# Suspended Job Object assignment and bounded process-tree cancellation.
process-wrap.workspace = true
windows.workspace = true
# System-directory lookup and inherited handle type admission for the owned,
# cancellable stdin reader, plus bounded CommandLineToArgv process projection.
# The GUI feature also owns the hidden, joined system-notification window.
# Reuse the cohort's existing safe Windows bindings.
winsafe = { workspace = true, features = ["kernel", "shell", "gui"] }
winapi-util.workspace = true
ctrlc = { version = "3.5.2", default-features = false }
crossterm = { version = "0.29.0", default-features = false, features = ["windows", "events"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["signal"] }
# `agent doctor` capsule/fingerprint digests run at CLI runtime.
sha2.workspace = true

[dev-dependencies]
# Shared GUI/TUI close-target corpus; reuse the already admitted workspace serde.
serde.workspace = true
jsonschema.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs", "process", "signal", "term"] }

[lints]
workspace = true
[target.'cfg(target_os = "linux")'.dev-dependencies]
orchbee-capability-node-protocol = { path = "../../crates/capability-node-protocol" }
orchbee-local-site-protocol = { path = "../../crates/local-site-protocol" }
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true
