[package]
name = "orchbee"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(unix)'.dependencies]
crossterm = { version = "0.29.0", default-features = false }
nix = { workspace = true, features = ["fs", "poll", "user"] }
orchbee-client-server-protocol = { path = "../../crates/client-server-protocol" }
orchbee-local-client-protocol = { path = "../../crates/local-client-protocol" }
ratatui = { version = "0.30.2", default-features = false, features = ["std"] }
rustix = { version = "1.1.4", default-features = false, features = ["fs", "termios"] }
signal-hook = { version = "0.3.18", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs", "process", "signal", "term"] }

[lints]
workspace = true
