[package]
name = "orchbee-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
# The console events the Client receives through the shared console must not end the launcher.
ctrlc.workspace = true
# The store pointer has one parser, shared with the Client's install owner.
orchbee-release-records = { path = "../../crates/release-records" }
# A Job that ends the Client with the launcher and keeps the Client's own children out of it.
process-wrap.workspace = true
# The launcher's own command line, passed on unchanged.
winsafe = { workspace = true, features = ["kernel"] }

[lints]
workspace = true
