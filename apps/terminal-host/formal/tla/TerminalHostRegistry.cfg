SPECIFICATION Spec

CONSTANTS
  Terminals = {terminal1, terminal2}
  CreationIds = {creation1, creation2}
  LaunchFingerprints = {launch1, launch2}
  OverlayFingerprints = {overlay1, overlay2}

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  RegistryEntryIntegrity

PROPERTIES
  DisconnectPreservesRetainedTerminals
  FailedSpawnIsAtomic
  FreshSuccessfulCreateCommitsWholeEntry
  WildcardReplayIgnoresOverlayFingerprint
  SuppliedOverlayConflictIsAtomic
  DisposeReleasesWholeEntry
