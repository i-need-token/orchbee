SPECIFICATION Spec

CONSTANTS
  Attachments = {attachment1, attachment2}
  MaxRevision = 1
  MaxActivityEpoch = 2
  \* Two sample opportunities cover active -> idle re-entry in one lifecycle.
  MaxCadence = 2
  MaxSequence = 2
  MaxPendingWrites = 2

CHECK_DEADLOCK FALSE

SYMMETRY AttachmentSymmetry

INVARIANTS
  TypeOK
  CurrentTokenFrameMatchesCache
  EpochExhaustionIsUnknown
  EveryReadAttachmentTracksActivityInvalidation
  InFlightInvalidationForcesSnapshotRetry
  PreparedFrameEpochCannotLead
  BatchFullCannotConsumeSequence
  SemanticStepWitness
