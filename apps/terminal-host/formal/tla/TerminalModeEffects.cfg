SPECIFICATION Spec

CONSTANT Scenario = "input-focus"
\* Large enough for a one-byte bracketed paste (twelve-byte wrapper charge)
\* with one byte of budget left after the smallest non-paste preparation.
CONSTANT MaxInputBytes = 14
CONSTANT MaxReplies = 1
CONSTANT MaxTime = 1
CONSTANT MaxGeometryRevision = 2
\* One finite projection transaction; repeated synchronized-output cycles are
\* outside this checked configuration.
CONSTANT MaxProjections = 1

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  PreparedInputIsChargedAfterExpansion
  PreparedPasteChargeTracksSnapshot
  PreparedInputFitsClientBudget
  NoPreparedInputHasResidualFields
  FocusEnableReplyMatchesAggregateSnapshot
  SynchronizedOutputOwnsOneDeadline
  ProjectionNeverCapturesWhileSynchronized
  SizeReplyNeverLeadsGeometry
  Mode40RestoreUsesViewportGeometry
  RequiredReplyFailureIsContained

PROPERTIES
  FailureFenceIsPermanent
