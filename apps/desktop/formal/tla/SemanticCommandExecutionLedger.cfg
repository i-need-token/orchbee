SPECIFICATION Spec

CONSTANT Requests = {request1, request2}
CONSTANT Fingerprints = {fingerprint1, fingerprint2}
CONSTANT Executions = {execution1, execution2, execution3}
CONSTANT HeavyExecutions = {execution3}
CONSTANT MaxActive = 1
CONSTANT MaxTerminalRecords = 1
CONSTANT MaxTerminalWeight = 4
CONSTANT MaxGeneration = 2

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  RequestAndExecutionMappingsAgree
  RetainedRequestHasOneHandlerStart
  ExecutionIdentityIsProcessUnique
  ActiveExecutionCapacity
  TerminalRetentionCapacity
  TerminalOrderMatchesState
  ExecutionResultMatchesPhase
  CancellationForwardedAtMostOnce
  CommittedExecutionNeverCancels
  ActiveExecutionsAreNotTerminalRecords
