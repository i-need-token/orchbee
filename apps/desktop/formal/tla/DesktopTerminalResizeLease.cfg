SPECIFICATION Spec

CONSTANTS
  Attachments = {attachment1, attachment2, attachment3}
  NoAttachment = none
  MaxRevision = 3
  MaxRank = 3

CONSTANT Scenario = "lease"

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  AdmissionRanksAreUnique
  AttachedAttachmentsHaveAdmissionRank
  IdleAttachmentsHaveOneOwner
  DesiredOwnerIsAttached
  EligibilityBelongsToAttached
  ClaimRanksAreUnique
  EligibleActivityRemainsEnabled
  OneOperationAtATime
  ObservedRevisionNeverLeadsRuntime
  GrantPendingBelongsToOwner
  BrokerInactiveGeometryIsEmpty
  BrokerPendingIsNewest
  BrokerActiveIsNewestWithoutPending
  BrokerCleanupDropsPending

PROPERTY LeaseActionSafety
PROPERTY ResizeActionSafety
PROPERTY BrokerActionSafety
PROPERTY PendingOperationEventuallyCommits
PROPERTY PendingResizeEventuallySynchronizes
PROPERTY QuiescedActivityEventuallySettles
PROPERTY GrantedOwnerEventuallySubmits
PROPERTY BrokerQuiescenceEventuallyDrains
