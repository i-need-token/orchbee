SPECIFICATION RelaySpec

\* Finite TLC exploration bounds only; none is a release queue, byte, or retry budget.
CONSTANTS
  Clients = {client_a, client_b}
  NoClient = no_client
  NoController = no_controller
  MaxSessionGeneration = 2
  MaxInputSequence = 2
  MaxGeometryRevision = 2
  RequestIds = {request_a, request_b}
  FirstOpaqueFrameBytes = opaque_frame_a
  SecondOpaqueFrameBytes = opaque_frame_b
  NoOpaqueFrame = no_opaque_frame
  MaxFrameSequence = 2
  MaxProjectionGeneration = 2
  MaxQueueDepth = 1
  MaxWorkerProgress = 1

CONSTANT MaxContentRevision = 2
CONSTANT MaxAttachmentGeneration = 2
CONSTANT MaxRequestSequence = 2
CONSTANT MaxHistorySequence = 4
CONSTANT MaxHistoryQueueDepth = 2
CONSTANT Scenario = "control-outcomes"

CHECK_DEADLOCK FALSE

INVARIANTS
  RelayTypeOK
  ViewerBelongsToCurrentSession
  ControllerGrantBelongsToViewer
  ServerLossEndsEffectiveClientTransport
  InputAndResizeHaveOneController
  AcquisitionNeverTakesOver
  NoAutomaticControllerTransfer
  ControllerInputIsExact
  ControllerResizeIsExact
  NonControllerInputPreservesTerminalInput
  NonControllerResizePreservesGeometry
  OnlyControllerInputAdvances
  OnlyControllerResizeAdvances
  ControllerDetachReleasesAuthority
  ViewerDetachPreservesSession
  ControllerDisconnectReleasesAuthority
  StaleCleanupPreservesNewAuthority
  ServerAndWorkerLossNeverTransferAuthority
  NonHostLossRetainsTerminal
  OnlyHostLossChangesTerminalState
  HostLossReportsTerminalLost
  LostTerminalAcceptsNoFurtherControl
  ViewerTransitionsAreExact
  RelayUsesImportedAuthority
  CurrentRelaySessionsAreRepresented
  AttachedSessionsHaveScopedGenerations
  DownstreamQueuesAreBoundedAndScoped
  RelayedRecordsPreserveSourceRecord
  SourceRecordIsUnique
  OneDeliveryFlightPerAttachment
  DetachedSessionsRetainNoDownstreamRecords
  FeedbackHasExactAttachmentScope
  FeedbackHasExactFlightIdentity
  ControlRequestShapeIsStrict
  PendingControlRefinesCombinedController
  UnknownControlIsNeverQueuedForReplay
  AppliedSequencesNeverExceedEmission
  BlockedRecoveryRequiresNewerRevision
  ClientDetachRetainsTerminal
  WorkerProgressRemainsEnabled
  PausedClientDoesNotBlockPeerDelivery
  HistoryQueuesAreBoundedAndScoped
  PollOvertakeIsBounded
  RetainedUnitsMatchQueues
  DetachedSessionsRetainNoHistoryState
  HistoryObservedEchoesDelivery
  HistorySequencesStayInsideEmission

PROPERTIES
  MismatchedFeedbackIsEffectFree
  BlockedRecoveryRejectionIsEffectFree
  WorkerProgressIsQueueIndependent
  HistoryDeliveryLeavesFrameFlightUnchanged
  HistoryOverflowCloseIsSessionLocal
