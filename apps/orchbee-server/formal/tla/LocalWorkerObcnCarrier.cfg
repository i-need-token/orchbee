SPECIFICATION Spec

CONSTANT Scenario = "response-validation"

CONSTANTS
  Workers = {WorkerA, WorkerB}
  NoWorker = NoWorker
  FirstTerminal = TerminalA
  SecondTerminal = TerminalB
  NoTerminal = NoTerminal
  FirstLaunchOperation = LaunchOperationA
  SecondLaunchOperation = LaunchOperationB
  StartOperation = StartOperation
  FirstCwdValidationOperation = CwdValidationOperationA
  SecondCwdValidationOperation = CwdValidationOperationB
  NoOperation = NoOperation
  FirstCwd = CwdA
  SecondCwd = CwdB
  NoCwd = NoCwd
  FirstLease = LeaseA
  SecondLease = LeaseB
  ThirdLease = LeaseC
  NoLease = NoLease
  FirstHostCreation = HostCreationA
  SecondHostCreation = HostCreationB
  NoHostCreation = NoHostCreation
  FirstHostTerminal = HostTerminalA
  SecondHostTerminal = HostTerminalB
  NoHostTerminal = NoHostTerminal
  FirstDefiniteOutcomePayload = DefiniteOutcomePayloadA
  SecondDefiniteOutcomePayload = DefiniteOutcomePayloadB
  NoOutcomePayload = NoOutcomePayload
  MaxGeneration = 2
  MaxFence = 2
  MaxLeaseExpiry = 3
  MaxHostEpoch = 2
  MaxTick = 3

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  OneActiveGenerationAndOneWireOwner
  QueueAndWireFlightAreBounded
  WireAndDeadlineStateAreExact
  LiveRequestsMatchAttemptHistory
  CompletionsRemainCorrelated
  KnownUnchangedMeansNoCompleteWrite
  ExactResultsPreserveValidatedIncomingResponse
  LaunchUnknownPayloadIsExact
  CwdValidationResultIsExactlyCorrelated
  EffectUnknownFollowsOneCompleteWrite
  UnknownEffectsAreNeverRetried
  InvalidResponsesNeverPublishAsExact
  BackpressureIsARecordedKnownUnchangedAttempt
  MismatchedAndLateResultsNeverPublishAsExact
  StaleCleanupCannotOwnCurrentGeneration
  MonotonicTime
  ReplacementActivationRequiresSettledHistory
  FullBackpressureIsFreshThirdAttempt
  InactiveStaleHandleIsKnownUnchanged

PROPERTIES
  PendingAttemptEventuallyCompletes
  PendingCompletionEventuallyPublishes
  PendingCleanupEventuallySettles
