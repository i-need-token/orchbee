id = "penguin"
version = "2026.11.11.1"
min_engine_version = 1
updated_at = "2026-11-11T00:00:00Z"
aliases = ["penguin-cli"]

# Penguin 0.2.x chat is a line-mode REPL with no spinner and no OSC title of its own. It prints
# an empty ">" prompt row only when it waits for a message. While a turn runs, the bottom row is
# its output: the submitted message, reasoning, tool lines or the answer. A long message typed
# but not yet sent also wraps past its prompt row, so that working evidence is not marked
# visible and passes through the startup grace and idle hold. A shell prompt on the bottom row is
# not Penguin output: its background server can outlive the chat in the same console.

[[rules]]
id = "empty_prompt_idle"
state = "idle"
priority = 50
region = "bottom_non_empty_lines(1)"
visible_idle = true
line_regex = ['^>\s*$']

[[rules]]
id = "output_below_prompt_working"
state = "working"
priority = 40
region = "bottom_non_empty_lines(1)"
regex = ['\S']
not = [
	{ line_regex = [
		'^>(?:\s|$)',
	] },
	{ line_regex = [
		'^\[stats\] ',
	] },
	{ line_regex = [
		'^(?:PS )?[A-Za-z]:\\.*>\s*$',
	] },
]
