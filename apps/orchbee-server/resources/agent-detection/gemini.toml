id = "gemini"
version = "2026.11.11.3"
min_engine_version = 1
updated_at = "2026-11-11T00:00:00Z"

# Orchbee extension: Gemini CLI 0.67 asks "Do you trust the files in this folder?" in a framed box
# when it starts in a folder it has not seen, and waits for one of its numbered choices. The rule
# needs the framed question and the first and last choice rows; the selection marker sits on any
# choice, and the folder names and the wrapped explanation are not matched. An answered box stays
# on screen above the restart line and the new composer, so either of those below it ends the match.
[[rules]]
id = "folder_trust_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(24)"
visible_blocker = true
line_regex = [
	'^\s*│\s+Do you trust the files in this folder\?\s*│?\s*$',
	'^\s*│\s+(?:●\s+)?1\. Trust folder\b',
	'^\s*│\s+(?:●\s+)?\d\. Don.t trust\b',
]
not = [
	{ line_regex = [
		'^\s*Gemini CLI is restarting to apply the trust changes',
	] },
	{ line_regex = [
		'^\s*▄{3,}\s*$',
	] },
	{ line_regex = [
		'^\s*▀{3,}\s*$',
	] },
]

[[rules]]
id = "apply_or_allow_change"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
	{ contains = [
		"│ Apply this change",
	] },
	{ contains = [
		"│ Allow execution",
	] },
	{ all = [
		{ contains = [
			"yes",
		] },
		{ any = [
			{ contains = [
				"waiting for user confirmation",
			] },
			{ contains = [
				"│ Do you want to proceed",
			] },
			{ contains = [
				"do you want to proceed?",
			] },
		] },
	] },
	{ line_regex = [
		'(?i)^\s*❯.*(yes|allow)',
	] },
]

[[rules]]
id = "esc_cancel_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
contains = ["esc to cancel"]

# Orchbee extension: Gemini CLI 0.68 draws its composer as a `>` input row between a ▄ row and a ▀
# row. Idle needs all three at the bottom of the screen; the placeholder is not matched, because
# typed text replaces it, and neither is the footer, which can be hidden or customised. The composer
# stays on screen during a turn, so the cancel hint and the confirmation questions end the match as
# well as outranking it.
[[rules]]
id = "composer_idle"
state = "idle"
priority = 50
region = "bottom_non_empty_lines(12)"
visible_idle = true
line_regex = [
	'^\s*▄{3,}\s*$',
	'^\s*>(?:\s|$)',
	'^\s*▀{3,}\s*$',
]
not = [
	{ contains = [
		"esc to cancel",
	] },
	{ contains = [
		"waiting for user confirmation",
	] },
	{ contains = [
		"do you want to proceed",
	] },
	{ contains = [
		"│ Apply this change",
	] },
	{ contains = [
		"│ Allow execution",
	] },
]
