id = "droid"
version = "2026.11.19.2"
min_engine_version = 1
updated_at = "2026-11-19T00:00:00Z"

[[rules]]
id = "execute_selection_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
contains = ["enter to select", "esc to cancel"]
any = [{ contains = ["↑↓ to navigate"] }, { contains = ["use ↑↓ to navigate"] }]
all = [{ any = [{ contains = ["> yes, allow"] }, { contains = ["> no, cancel"] }] }]

[[rules]]
id = "selection_menu_blocker"
state = "blocked"
priority = 290
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["enter select", "esc cancel"]
any = [{ contains = ["↑/↓ navigate"] }, { contains = ["↑↓ navigate"] }]

[[rules]]
id = "spinner_stop_working"
state = "working"
priority = 110
region = "whole_recent"
visible_working = true
contains = ["esc to stop"]
line_regex = ['^\s*[\u2800-\u28FF]']

[[rules]]
id = "stop_hint_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
contains = ["esc to stop"]

# Orchbee: Droid v1.6.0 asks whether to trust a new folder before its first turn; the question and its live
# choice footer are both required.
[[rules]]
id = "folder_trust_blocker"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(24)"
visible_blocker = true
contains = ["trust this folder?", "enter to confirm"]

# Orchbee: the idle composer is the `>` row over the `? for help` footer. A running turn shows the same row
# with `Enter to steer`, so the busy rules above outrank this rule by priority.
[[rules]]
id = "composer_idle"
state = "idle"
priority = 10
region = "bottom_non_empty_lines(3)"
visible_idle = true
contains = ["? for help"]
line_regex = ['^\s*>']
