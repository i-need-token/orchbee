id = "copilot"
version = "2026.11.19.2"
min_engine_version = 4
updated_at = "2026-11-19T00:00:00Z"
aliases = ["github-copilot", "ghcs"]

# Orchbee: the bottom edge of the prompt box (`╹▀▀▀`) is the anchor; the side bar and the top edge (`╻▄▄▄`) are the area's top.
[input_area]
anchor = '^\s*╹▀{3,}'
above = '^\s*(┃|╻▄{3,})'

[[rules]]
id = "selection_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
all = [
	{ any = [
		{ contains = [
			"esc to cancel",
		] },
		{ contains = [
			"esc cancel",
		] },
	] },
	{ any = [
		{ contains = [
			"enter to select",
		] },
		{ contains = [
			"enter to confirm",
		] },
		{ contains = [
			"enter to submit",
		] },
		{ contains = [
			"enter accept",
		] },
	] },
]

# Orchbee: Copilot CLI 1.0.114 shows `● Working ctrl+c interrupt` while a turn runs; its dot alternates
# between ● and ○.
[[rules]]
id = "working_footer"
state = "working"
priority = 105
region = "bottom_non_empty_lines(3)"
visible_working = true
line_regex = ['^\s*[●○]\s+Working\s+ctrl\+c interrupt']

# Orchbee: the idle composer shows `Interactive · <mode> · / commands` under its bottom border (`╹▀▀`).
[[rules]]
id = "composer_idle"
state = "idle"
priority = 10
region = "bottom_non_empty_lines(4)"
visible_idle = true
line_regex = ['^\s*Interactive · [^·]+· / commands\b', '^\s*╹▀+']

[[rules]]
id = "background_agents_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(6)"
visible_working = true
line_regex = ['^\s*◎\s+Waiting for background agents(?:\s|·|$)']

[[rules]]
id = "working_cancel_hint"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
any = [
	{ contains = [
		"esc to cancel",
	] },
	{ contains = [
		"esc cancel",
	] },
	{ contains = [
		"esc again to cancel",
	] },
	{ contains = [
		"esc interrupt",
	] },
]
