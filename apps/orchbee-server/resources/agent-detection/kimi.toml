id = "kimi"
version = "2026.11.19.1"
min_engine_version = 1
updated_at = "2026-11-19T00:00:00Z"
aliases = ["kimi-code", "kimi code"]

[[rules]]
id = "current_approval_panel"
state = "blocked"
priority = 400
region = "whole_recent"
visible_blocker = true
contains = ["↵ confirm"]
any = [
	{ contains = [
		"run this command?",
	] },
	{ contains = [
		"write this file?",
	] },
	{ contains = [
		"apply these edits?",
	] },
	{ contains = [
		"stop this task?",
	] },
	{ contains = [
		"ready to build with this plan?",
	] },
	{ line_regex = [
		'(?i)^\s*▶?\s*approve .*\?$',
	] },
]
all = [
	{ contains = [
		" choose",
	] },
	{ any = [
		{ contains = [
			"approve",
		] },
		{ contains = [
			"reject",
		] },
		{ contains = [
			"revise",
		] },
	] },
]

[[rules]]
id = "question_panel"
state = "blocked"
priority = 390
region = "whole_recent"
visible_blocker = true
contains = ["↑↓ select", "esc cancel"]
line_regex = ['^\s*question\s*$', '^\s*\? ']
any = [{ contains = ["↵ choose"] }, { contains = ["↵ toggle"] }, { contains = ["↵ save"] }]

[[rules]]
id = "legacy_approval_panel"
state = "blocked"
priority = 300
region = "whole_recent"
contains = ["requesting approval", "reject"]
any = [{ contains = ["approve once"] }, { contains = ["approve for this session"] }]
all = [{ any = [{ contains = ["1/2/3/4 choose"] }, { contains = ["↵ confirm"] }] }]

[[rules]]
id = "background_agent_status_working"
state = "working"
priority = 120
region = "bottom_non_empty_lines(3)"
visible_working = true
line_regex = ['(?i)\bkimi[-\w.]*\s+thinking\b.*\[[1-9][0-9]*\s+agents?\s+running\]']

[[rules]]
id = "moon_spinner_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
line_regex = ['^\s*(🌕|🌖|🌗|🌘|🌑|🌒|🌓|🌔)\s*$']

# Orchbee correction: Kimi Code 2.5 ends the status word with an ellipsis character
# (`\u280B Working\u2026 \u00B7 Tip: \u2026`) instead of three dots.
[[rules]]
id = "braille_spinner_working"
state = "working"
priority = 90
region = "whole_recent"
visible_working = true
line_regex = ['(?i)^\s*[\u2800-\u28FF]+\s*(thinking(\.\.\.|\u2026)|working(\.\.\.|\u2026)|using )']

# Orchbee: Kimi Code 2.5.3 animates a moon phase followed by a rotating tip (`🌒 · Tip: …`) while a
# turn runs. The bare-glyph rule above does not match that line, so this rule reads it in the live rows.
[[rules]]
id = "moon_tip_spinner_working"
state = "working"
priority = 105
region = "bottom_non_empty_lines(8)"
visible_working = true
line_regex = ['^\s*(🌑|🌒|🌓|🌔|🌕|🌖|🌗|🌘)\s+·\s']

# Orchbee: the composer's `│ >` row with the `context: N%` footer is idle only when no busy line is live;
# the busy rules outrank it by priority.
[[rules]]
id = "composer_idle"
state = "idle"
priority = 10
region = "bottom_non_empty_lines(6)"
visible_idle = true
line_regex = ['^\s*│ >', 'context: \d+(\.\d+)?% \(']

# Orchbee: Kimi Code 2.5.3 asks whether to trust a new folder before its first turn; the question and
# its live choice footer are both required.
[[rules]]
id = "trust_folder_blocker"
state = "blocked"
priority = 380
region = "whole_recent"
visible_blocker = true
contains = ["trust this folder?", "enter select"]
