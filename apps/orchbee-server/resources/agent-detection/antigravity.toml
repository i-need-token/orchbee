id = "agy"
version = "2026.11.27.1"
min_engine_version = 4
updated_at = "2026-11-27T00:00:00Z"
aliases = ["antigravity", "antigravity-cli"]

# Orchbee: the composer is the `>` row between two separator rules; the first separator is the area's top.
[input_area]
anchor = '^\s*>(\s|$)'
above = '^\s*─{8,}'

[[rules]]
id = "permission_prompt"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
contains = ["requesting permission for:"]
any = [{ contains = ["do you want to proceed?"] }, { contains = ["tab amend", "edit command"] }]

# Herdr's Antigravity CLI 1.2.17 evidence: a dialog that replaces the prompt box ends with a key-hint row above the
# footer, `↑/↓ Navigate · tab Amend · …` for a permission and `↑/↓ Navigate · enter Select · esc Skip` for a question.
# Orchbee: the usage row under the 1.5.12 footer is in the region too.
[[rules]]
id = "permission_dialog"
state = "blocked"
priority = 310
region = "bottom_non_empty_lines(3)"
visible_blocker = true
contains = ["navigate", "tab amend"]

[[rules]]
id = "question_dialog"
state = "blocked"
priority = 290
region = "bottom_non_empty_lines(3)"
visible_blocker = true
contains = ["navigate", "esc skip"]

# Orchbee: Antigravity CLI 1.5.12 asks whether to trust a new project folder before its first turn; the
# question and its navigation footer are both required.
[[rules]]
id = "trust_project_blocker"
state = "blocked"
priority = 350
region = "whole_recent"
visible_blocker = true
contains = ["do you trust the contents of this project?", "enter confirm"]

# Orchbee: the footer reads `esc to cancel` while a turn runs. A step list or task panel under the prompt box
# pushes the footer up from the bottom rows.
[[rules]]
id = "esc_cancel_working"
state = "working"
priority = 95
region = "bottom_non_empty_lines(16)"
visible_working = true
line_regex = ['^\s*esc to cancel\b']

# Orchbee: the live spinner sits above the composer, so a spinner line left in the transcript decides nothing.
[[rules]]
id = "spinner_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(16)"
visible_working = true
line_regex = ['^\s*[\u2800-\u28FF]+\s+\p{Alphabetic}+\w*ing\b']

# Herdr's evidence: the spinner can lead a thought summary or a step count, such as `\u280B 2/4 steps \u00B7 Running
# command...`, in place of an -ing word.
[[rules]]
id = "spinner_summary_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(16)"
visible_working = true
line_regex = ['^\s*[\u2801-\u28FF]+\s+\S']

# Orchbee: the idle composer is the `>` row between two separator rows above the `? for shortcuts` footer.
# Background tasks, subagents and timers that a finished turn left running are not working, as in Herdr's later
# rules. Antigravity CLI 1.5.16 lists them between the composer and the footer under a rule of their own, two rows
# and `↓ 1 more` for three tasks, and adds `· N task(s) · /tasks` to the footer.
[[rules]]
id = "composer_idle"
state = "idle"
priority = 10
region = "bottom_non_empty_lines(16)"
visible_idle = true
line_regex = ['^\s*\? for shortcuts\b', '^\s*>']
