id = "kilo"
version = "2026.11.11.1"
min_engine_version = 1
updated_at = "2026-11-11T00:00:00Z"
aliases = ["kilo-code", "kilo code"]

[[rules]]
id = "opencode_permission"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
	{ contains = [
		"△ Permission required",
	] },
	{ contains = [
		"esc dismiss",
	], any = [
		{ contains = [
			"enter confirm",
		] },
		{ contains = [
			"enter submit",
		] },
		{ contains = [
			"enter toggle",
		] },
	], all = [
		{ any = [
			{ contains = [
				"↑↓ select",
			] },
			{ contains = [
				"⇆ tab",
			] },
		] },
	] },
]

[[rules]]
id = "esc_interrupt_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
contains = ["esc interrupt"]

# Orchbee extension: Kilo CLI 7.8 is built on OpenCode 1.x, whose rules above have no idle rule.
# Idle needs the prompt-box bottom with the key-hint footer that ends in "commands" on the row
# directly beneath it, wherever the box sits: the start screen centres it above notices and tips.
# An interrupt hint on that footer row is busy chrome, and an open command list covers both rows.
[[rules]]
id = "prompt_footer_idle"
state = "idle"
priority = 50
region = "whole_recent"
visible_idle = true
regex = ['(?m)^[ \t]*╹▀{3,}[ \t]*\r?\n[^\n]*\S commands[ \t]*\r?$']
not = [
	{ regex = [
		'(?mi)^[ \t]*╹▀{3,}[ \t]*\r?\n[^\n]*\binterrupt\b',
	] },
	{ line_regex = [
		'(?i)\besc (?:again to )?interrupt\b',
	] },
	{ regex = [
		'(■|⬝){4,}',
	] },
	{ contains = [
		"esc dismiss",
	] },
	{ contains = [
		"△ Permission required",
	] },
]
