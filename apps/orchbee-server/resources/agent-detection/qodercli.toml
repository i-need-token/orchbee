id = "qodercli"
version = "2026.11.19.2"
min_engine_version = 1
updated_at = "2026-11-19T00:00:00Z"
aliases = ["qoderclicn", "qoder", "qodercn"]

[[rules]]
id = "confirmation_or_input_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
	{ contains = [
		"waiting for user confirmation",
	], any = [
		{ contains = [
			"yes",
		] },
		{ contains = [
			"no",
		] },
		{ contains = [
			"allow",
		] },
		{ contains = [
			"reject",
		] },
	] },
	{ contains = [
		"awaiting approval",
	], any = [
		{ contains = [
			"allow",
		] },
		{ contains = [
			"reject",
		] },
	] },
	{ contains = [
		"permission required",
	] },
	{ contains = [
		"allow once or always?",
	] },
	{ contains = [
		"asking user",
	] },
	{ contains = [
		"enter your response",
	] },
	{ contains = [
		"review your answers:",
	] },
	{ contains = [
		"shell awaiting input",
	] },
]

[[rules]]
id = "cancel_hint_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
contains = ["(esc to cancel,"]

[[rules]]
id = "spinner_working"
state = "working"
priority = 90
region = "whole_recent"
visible_working = true
line_regex = ['^\s*[\u2800-\u28FF]\s+.*\p{Alphabetic}']

# Orchbee: Qoder CLI 1.1.93 asks whether to trust a new folder before its first turn; the question and its
# navigation footer are both required.
[[rules]]
id = "folder_trust_blocker"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(24)"
visible_blocker = true
contains = ["do you trust the files in this folder?", "enter select"]

# Orchbee: the idle composer is the `>` row between separator rows, above the `ctx N%` status line that ends
# the screen; `? for shortcuts` sits above the top separator. A running turn shows the composer too, so the
# busy rules above outrank this rule by priority.
[[rules]]
id = "composer_idle"
state = "idle"
priority = 10
region = "bottom_non_empty_lines(7)"
visible_idle = true
contains = ["? for shortcuts"]
line_regex = ['^\s*>\s', 'ctx\s+\S+\s+\d+%']
