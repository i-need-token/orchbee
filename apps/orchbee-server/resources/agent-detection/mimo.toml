id = "mimo"
version = "2026.11.11.3"
min_engine_version = 1
updated_at = "2026-11-11T00:00:00Z"
aliases = ["mimocode", "mimo-code"]

# MiMo Code 0.1.x is built on OpenCode 1.x, so these are opencode.toml's OpenCode 1.x rules adapted
# to it. MiMo's busy spinner is a UFO with a dot trail instead of OpenCode's progress squares, and
# its brand replaces OpenCode's in the interrupt hint. Its OSC title (`MC | <session>`) names the
# session and does not change while a turn runs, so it carries no state. Three rules are MiMo's
# own: the startup workspace trust question, whose live choices carry ●/○ bullets until it is
# answered, the busy footer's interrupt hint, and idle, which the OpenCode 1.x rules do not detect.

[[rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
	{ contains = [
		"△ Permission required",
	] },
	{ contains = [
		"esc dismiss",
	], any = [
		{ contains = [
			"enter confirm",
		] },
		{ contains = [
			"enter submit",
		] },
		{ contains = [
			"enter toggle",
		] },
	], all = [
		{ any = [
			{ contains = [
				"↑↓ select",
			] },
			{ contains = [
				"⇆ tab",
			] },
		] },
	] },
]

[[rules]]
id = "workspace_trust_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(4)"
visible_blocker = true
line_regex = ['^│\s+[●○] Yes, I trust this folder\s*$', '^│\s+[●○] No, exit\s*$', '^└\s*$']

[[rules]]
id = "interrupt_hint_working"
state = "working"
priority = 110
region = "whole_recent"
visible_working = true
any = [
	{ contains = [
		"esc to interrupt",
	] },
	{ contains = [
		"ctrl+c to interrupt",
	] },
	{ contains = [
		"press esc to interrupt",
	] },
	{ line_regex = [
		'(?i).*mimo.*esc (again to )?interrupt',
	] },
]

[[rules]]
id = "progress_bar_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
regex = ['[∙·˙]🛸|🛸[∙·˙]']

# The busy footer under the prompt box starts with the spinner and "esc interrupt"; the spinner
# has frames without a dot beside the UFO, so the hint decides on its own. A narrow pane wraps the
# hint and leaves "interrupt" alone on the next row.
[[rules]]
id = "interrupt_footer_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(3)"
visible_working = true
any = [
	{ line_regex = [
		'(?i)\besc (?:again to )?interrupt\b',
	] },
	{ line_regex = [
		'^\s*interrupt\s*$',
	] },
]

# Idle needs the live prompt box bottom with the key-hint footer that ends in "commands" beneath
# it, on the next row or, in a narrow pane that wraps each hint into two rows, on the row after.
# The start screen centres the box above a tip and draws twinkling stars and a shooting star of
# braille dots in the rows around it, so the rule finds the box anywhere instead of counting rows.
[[rules]]
id = "prompt_footer_idle"
state = "idle"
priority = 50
region = "whole_recent"
visible_idle = true
regex = ['(?m)^[ \t]*╹▀{3,}[^\n]*\n(?:[^\n]*\n)?[^\n]*\scommands(?:[ \t][^\n]*)?\r?$']
not = [
	{ line_regex = [
		'(?i)\besc (?:again to )?interrupt\b',
	] },
	{ line_regex = [
		'^\s*interrupt\s*$',
	] },
	{ regex = [
		'[∙·˙]🛸|🛸[∙·˙]',
	] },
	{ contains = [
		"esc dismiss",
	] },
	{ contains = [
		"△ Permission required",
	] },
]
