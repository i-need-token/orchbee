id = "codebuddy"
version = "2026.11.19.2"
min_engine_version = 1
updated_at = "2026-11-19T00:00:00Z"
aliases = ["codebuddy-code"]

# CodeBuddy Code 2.x asks two startup questions before it accepts a message: a folder trust list
# and, without a login, a login-method list. Both wait for a choice. A running turn shows a spinner
# status line above the composer, and a finished turn shows the composer between two rules.

[[rules]]
id = "folder_trust_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(24)"
visible_blocker = true
contains = ["do you trust the files in this folder?", "enter to confirm • esc to exit"]
line_regex = ['^│\s+(?:> )?\d+\. Trust folder']

[[rules]]
id = "login_method_prompt"
state = "blocked"
priority = 290
region = "bottom_non_empty_lines(10)"
visible_blocker = true
line_regex = ['^\s*Select login method:\s*$', '^\s*\(Use ↑↓ to select, Enter to login\)\s*$']

# Orchbee: a running turn shows a Dingbat spinner status line above its composer, such as
# `✸ Waking… (0s · waiting for model)`; a finished turn shows `✔ Worked for 6s` instead.
[[rules]]
id = "spinner_status_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(10)"
visible_working = true
line_regex = ['^\s*[✶✷✸✹✺✻✼✽✾✿]\s+\S+…\s+\(\d+s\s+·']

# Orchbee: the idle composer is the bare `>` row between two rules, under the footer that ends in
# `? for shortcuts`. The spinner status line above it outranks this rule while a turn runs.
[[rules]]
id = "composer_idle"
state = "idle"
priority = 10
region = "bottom_non_empty_lines(4)"
visible_idle = true
contains = ["? for shortcuts"]
line_regex = ['^\s*>\s*$']
