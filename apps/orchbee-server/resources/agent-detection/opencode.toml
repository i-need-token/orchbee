id = "opencode"
version = "2026.11.12.1"
min_engine_version = 4
updated_at = "2026-11-12T00:00:00Z"
aliases = ["open-code"]

# OpenCode 2.x: the prompt box's left bar rows down to its bottom edge, then status and footer.
# Transcript message boxes draw the bar without the bottom edge, so they never anchor.
[input_area]
anchor = '^\s*╹▀{3,}'
above = '^\s*┃'

[[rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
	{ contains = [
		"△ Permission required",
	] },
	{ contains = [
		"esc dismiss",
	], any = [
		{ contains = [
			"enter confirm",
		] },
		{ contains = [
			"enter submit",
		] },
		{ contains = [
			"enter toggle",
		] },
	], all = [
		{ any = [
			{ contains = [
				"↑↓ select",
			] },
			{ contains = [
				"⇆ tab",
			] },
		] },
	] },
]

[[rules]]
id = "interrupt_hint_working"
state = "working"
priority = 110
region = "whole_recent"
visible_working = true
any = [
	{ contains = [
		"esc to interrupt",
	] },
	{ contains = [
		"ctrl+c to interrupt",
	] },
	{ contains = [
		"press esc to interrupt",
	] },
	{ line_regex = [
		'(?i).*opencode.*esc (again to )?interrupt',
	] },
]

[[rules]]
id = "progress_bar_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
regex = ['(■|⬝){4,}']

# opencode 2.x footer: an interrupt hint beside the live prompt box means a turn is running.
[[rules]]
id = "interrupt_footer_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(3)"
visible_working = true
line_regex = ['(?i)\besc (?:again to )?interrupt\b']

# Idle needs the live prompt box bottom and the command footer with no busy or question chrome.
[[rules]]
id = "prompt_footer_idle"
state = "idle"
priority = 50
region = "bottom_non_empty_lines(4)"
visible_idle = true
line_regex = ['^\s*╹▀{3,}', '\S commands(?:\s|$)']
not = [
	{ line_regex = [
		'(?i)\besc (?:again to )?interrupt\b',
	] },
	{ regex = [
		'(■|⬝){4,}',
	] },
	{ contains = [
		"esc dismiss",
	] },
	{ contains = [
		"△ Permission required",
	] },
]
