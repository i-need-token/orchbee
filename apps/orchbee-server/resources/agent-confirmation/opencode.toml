# OpenCode's permission dialog, as OpenCode 2.2.5 draws it on Windows from 77 to 143 columns.
#
# The dialog is a box at the bottom of the screen with a bar in its third column. A command, or a
# file's path and diff, is drawn behind the same bar and two spaces as the title, so a line of a
# command can draw a second title: the title must be the only one on the screen. The box is laid
# out from its top, so a dialog with any row on the screen has its title there; in a short Panel
# its last rows are cut instead, and that dialog waits.
#
# The box is at most 15 rows tall. A command taller than that is cut with no mark: after its
# sixth row where the keys have a row of their own, after its eighth where they sit beside the
# options, from 80 columns on. A command that fills those rows waits. From about 120 columns a
# sidebar may write the folder at the right end of the last row.
#
# The options differ only in colour, and a mouse moving over the dialog with no button pressed
# selects the option under it. A dialog is read only while "Allow once" is drawn apart from the
# two others, which are drawn alike; "Always allow" selected also changes the text above.

top = '  ┃  △ Permission required'
only = true

[[layout]]
name = "shell"
kind = "command"
accept = "enter"
selected = "once"
unselected = ["always", "reject"]
rows = [
	'  ┃  △ Permission required\n',
	'  ┃\n',
	'(?P<text>  ┃  \$ [^\n]+\n(?:  ┃  [^$ \n][^\n]*\n){0,4})',
	'  ┃\n',
	'  ┃\n',
	'  ┃   (?P<once>Allow once)   (?P<always>Always allow)   (?P<reject>Reject)\n',
	'  ┃\n',
	'  ┃  ctrl\+f fullscreen  ⇆ select  enter confirm\n',
	'  ┃\n',
]
# The first row carries the `$`; a wrapped row, or the next line of the command, is its text.
text = ['  ┃  (?:\$ )?(?P<text>.*)']

[[layout]]
name = "shell-wide"
kind = "command"
accept = "enter"
selected = "once"
unselected = ["always", "reject"]
rows = [
	'  ┃  △ Permission required\n',
	'  ┃\n',
	'(?P<text>  ┃  \$ [^\n]+\n(?:  ┃  [^$ \n][^\n]*\n){0,6})',
	'  ┃\n',
	'  ┃\n',
	'  ┃   (?P<once>Allow once)   (?P<always>Always allow)   (?P<reject>Reject) {2,}ctrl\+f[ a-z+⇆]*\n',
	'  ┃(?: {20,}[^ \n][^\n]*)?\n',
]
text = ['  ┃  (?:\$ )?(?P<text>.*)']

# A file written whole and a file changed in place both show as an edit of the path. A long path
# continues on rows of its own.
[[layout]]
name = "edit"
kind = "file-edit"
accept = "enter"
selected = "once"
unselected = ["always", "reject"]
rows = [
	'  ┃  △ Permission required\n',
	'(?P<text>  ┃    → Edit [^ \n][^\n]*\n(?:  ┃      [^ \n][^\n]*\n){0,15})',
	'  ┃\n',
	'(?:  ┃(?: [^\n]*)?\n){1,12}',
	'  ┃   (?P<once>Allow once)   (?P<always>Always allow)   (?P<reject>Reject)\n',
	'  ┃\n',
	'  ┃  ctrl\+f fullscreen  ⇆ select  enter confirm\n',
	'  ┃\n',
]
# A path on one row is its text; a path on several rows is not all one row and waits.
text = ['  ┃    → Edit (?P<text>.*)', '(?P<text>.*)']

[[layout]]
name = "edit-wide"
kind = "file-edit"
accept = "enter"
selected = "once"
unselected = ["always", "reject"]
rows = [
	'  ┃  △ Permission required\n',
	'(?P<text>  ┃    → Edit [^ \n][^\n]*\n(?:  ┃      [^ \n][^\n]*\n){0,15})',
	'  ┃\n',
	'(?:  ┃(?: [^\n]*)?\n){1,12}',
	'  ┃   (?P<once>Allow once)   (?P<always>Always allow)   (?P<reject>Reject) {2,}ctrl\+f[ a-z+⇆]*\n',
	'  ┃(?: {20,}[^ \n][^\n]*)?\n',
]
text = ['  ┃    → Edit (?P<text>.*)', '(?P<text>.*)']
