# Claude Code's tool confirmations, as Claude Code 2.1.330 draws them at any width.
#
# Text the model supplies is always indented: the description under the title, the command or
# diff between the two dashed rules, and the path. The dashed rules and the top border start in
# the first column, which that text cannot reach, so it cannot draw a rule, an option or a footer.

top = '─{20,}'

[[layout]]
name = "bash"
kind = "command"
accept = "enter"
# The rows under the title are the optional auto-mode tip and the model's description. A row
# with a symbol Claude Code does not use there fails the match; a warning in words is a marker.
danger = '(?i)danger|warning|caution|destructive|unsafe|irreversible|permanent|cannot be undone'
rows = [
	'─{20,}\n',
	' Bash command\n',
	'''(?P<notes>(?: [\p{L}\p{N}.,:;!?'"“”‘’()\[\]@#&*+=/\\_~—–-][\p{L}\p{N} .,:;!?'"“”‘’()\[\]@#&*+=/\\_~—–-]*\n){0,8})''',
	'╌{20,}\n',
	'(?P<text>(?: [^\n]+\n){1,16})',
	'╌{20,}\n',
	' Do you want to proceed\?\n',
	' ❯ 1\. Yes\n',
	'(?:   [2-4]\. Yes, and [^\n]*\n(?:      [^\n]+\n){0,6}){0,3}',
	'   [2-5]\. No\n',
	'\n',
	' Esc to cancel · Tab to amend\n',
]
# A command on one row has a one-column gutter; a command on several rows has a bar in it.
text = [' │ (?P<text>.*)', ' (?P<text>[^│].*)']

[[layout]]
name = "create"
kind = "file-create"
accept = "enter"
rows = [
	'─{20,}\n',
	' Create file\n',
	' (?P<text>[^ \n][^\n]*)\n',
	'╌{20,}\n',
	'(?: [^\n]*\n){0,400}',
	'╌{20,}\n',
	' Do you want to create [^\n]+\?\n',
	' ❯ 1\. Yes\n',
	'   2\. Yes, and [^\n]*\n(?:      [^\n]+\n){0,6}',
	'   3\. No\n',
	'\n',
	' Esc to cancel · Tab to amend\n',
]

[[layout]]
name = "edit"
kind = "file-edit"
accept = "enter"
rows = [
	'─{20,}\n',
	' Edit file\n',
	' (?P<text>[^ \n][^\n]*)\n',
	'╌{20,}\n',
	'(?: [^\n]*\n){0,400}',
	'╌{20,}\n',
	' Do you want to make this edit to [^\n]+\?\n',
	' ❯ 1\. Yes\n',
	'   2\. Yes, and [^\n]*\n(?:      [^\n]+\n){0,6}',
	'   3\. No\n',
	'\n',
	' Esc to cancel · Tab to amend\n',
]
