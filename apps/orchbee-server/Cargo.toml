[package]
autotests = false
name = "orchbee-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
getrandom.workspace = true
orchbee-local-ipc = { path = "../../crates/local-ipc" }
orchbee-agent-integration = { path = "../../crates/agent-integration" }
orchbee-agent-observation-protocol = { path = "../../crates/agent-observation-protocol" }
orchbee-local-runtime = { path = "../../crates/local-runtime" }
base64.workspace = true
hmac = { version = "0.13.0", default-features = false }
# Production observation envelopes reuse the workspace JSON parser.
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
# Pinned provider screen rules, plugin link handlers and event probes compile on every target.
regex.workspace = true
toml.workspace = true

orchbee-terminal-protocol = { path = "../../crates/terminal-protocol" }
orchbee-capability-node-protocol = { path = "../../crates/capability-node-protocol" }
orchbee-client-server-protocol = { path = "../../crates/client-server-protocol" }
orchbee-connection-handshake = { path = "../../crates/connection-handshake" }
orchbee-files-protocol = { path = "../../crates/files-protocol" }
orchbee-local-client-protocol = { path = "../../crates/local-client-protocol" }
orchbee-local-peer-credentials = { path = "../../crates/local-peer-credentials" }
orchbee-local-worker-protocol = { path = "../../crates/local-worker-protocol" }
orchbee-machine-protocol = { path = "../../crates/machine-protocol" }
orchbee-workbench-protocol = { path = "../../crates/workbench-protocol" }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["dir", "fs", "poll", "process", "user"] }
signal-hook.workspace = true

# `renameat2` for every Linux C library: nix offers it with glibc only.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# Owned inbox-curl Jobs reuse the workspace-pinned, patched child-settlement adapter.
process-wrap.workspace = true
windows.workspace = true
# Parse Host process command lines with the Windows API; never infer identity from shell text.
winsafe = { workspace = true, features = ["shell"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
