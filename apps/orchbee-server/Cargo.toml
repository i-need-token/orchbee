[package]
name = "orchbee-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
getrandom.workspace = true
orchbee-local-ipc = { path = "../../crates/local-ipc" }
orchbee-agent-observation-protocol = { path = "../../crates/agent-observation-protocol" }
orchbee-local-site-runtime = { path = "../../crates/local-site-runtime" }
base64.workspace = true
hmac = { version = "=0.12.1", default-features = false }
# Admitted dependency-scope delta: the existing pinned JSON parser, required
# at runtime — not only tests — to execute the accepted production
# observation envelope (hook-ingress signal payloads). No new package,
# version change, or public behavior.
serde_json = "=1.0.151"
serde.workspace = true
sha2.workspace = true

orchbee-terminal-protocol = { path = "../../crates/terminal-protocol" }
orchbee-capability-node-protocol = { path = "../../crates/capability-node-protocol" }
orchbee-client-server-protocol = { path = "../../crates/client-server-protocol" }
orchbee-local-client-protocol = { path = "../../crates/local-client-protocol" }
orchbee-local-peer-credentials = { path = "../../crates/local-peer-credentials" }
orchbee-local-site-protocol = { path = "../../crates/local-site-protocol" }
orchbee-workbench-protocol = { path = "../../crates/workbench-protocol" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "poll", "process"] }

[target.'cfg(windows)'.dependencies]
# Owned inbox-curl Jobs reuse the workspace-pinned, patched child-settlement adapter.
process-wrap.workspace = true
windows.workspace = true
# Pinned provider screen rules compiled once by the Windows sampler.
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode", "perf"] }
toml = { version = "=1.1.6", default-features = false, features = ["std", "parse", "serde"] }
# Parse Host process command lines with the Windows API; never infer identity from shell text.
winsafe = { workspace = true, features = ["shell"] }

[lints]
workspace = true

[dev-dependencies]
# Portable pure-rule conformance tests use the same locked parser versions.
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode", "perf"] }
toml = { version = "=1.1.6", default-features = false, features = ["std", "parse", "serde"] }
