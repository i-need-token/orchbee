[package]
autotests = false
name = "orchbee-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
getrandom.workspace = true
orchbee-agent-integration = { path = "../../crates/agent-integration" }
orchbee-agent-integration-writer = { path = "../../crates/agent-integration-writer" }
orchbee-color-themes = { path = "../../crates/color-themes" }
orchbee-connection-handshake = { path = "../../crates/connection-handshake" }
orchbee-local-ipc = { path = "../../crates/local-ipc" }
orchbee-local-runtime = { path = "../../crates/local-runtime" }

orchbee-capability-node-protocol = { path = "../../crates/capability-node-protocol" }
orchbee-local-peer-credentials = { path = "../../crates/local-peer-credentials" }
orchbee-local-worker-protocol = { path = "../../crates/local-worker-protocol" }
orchbee-terminal-protocol = { path = "../../crates/terminal-protocol" }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "poll", "socket", "user"] }

[target.'cfg(windows)'.dependencies]
process-wrap.workspace = true
windows.workspace = true
winsafe = { workspace = true, features = ["advapi", "kernel", "shell"] }
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
