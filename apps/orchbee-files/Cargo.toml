[package]
name = "orchbee-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chardetng = { version = "1.0.0", default-features = false }
encoding_rs = { version = "0.8.44", default-features = false, features = ["alloc"] }
getrandom.workspace = true
notify = { version = "9.0.0", default-features = false, features = ["macos_fsevent"] }
orchbee-connection-handshake = { path = "../../crates/connection-handshake" }
orchbee-files-protocol = { path = "../../crates/files-protocol" }
orchbee-git-process = { path = "../../crates/git-process" }
orchbee-local-ipc = { path = "../../crates/local-ipc" }
orchbee-local-peer-credentials = { path = "../../crates/local-peer-credentials" }
orchbee-local-runtime = { path = "../../crates/local-runtime" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true
trash = { version = "5.4.0", default-features = false, features = ["freedesktop", "jiff"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Com", "Win32_UI_Shell"] }
# The Recycle Bin adapter's progress sink uses `#[implement]`, whose expansion names `windows_core`.
windows-core = { version = "0.62.2", default-features = false }

[dev-dependencies]
serde.workspace = true

# This application's one accepted operating-system boundary cannot inherit the workspace's
# `forbid`, because its private `recycle_bin_native` module must locally admit reviewed shell
# calls. The Rust runner pins this exact exception.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
wildcard_imports = "deny"
