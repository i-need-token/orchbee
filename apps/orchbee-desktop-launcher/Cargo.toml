[package]
name = "orchbee-desktop-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
# The window pointer has one parser, shared with the store's writers and the command launcher.
orchbee-release-records = { path = "../../crates/release-records" }

[target.'cfg(windows)'.dependencies]
# The parent check and wait, the message box, and the Windows display language its copy follows.
winsafe = { workspace = true, features = ["advapi", "kernel", "user"] }

[lints]
workspace = true
