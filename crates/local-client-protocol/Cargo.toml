[package]
autotests = false
name = "orchbee-local-client-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false


[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { workspace = true, features = ["fs", "poll", "socket"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { workspace = true, features = ["fs"] }
[dependencies]
orchbee-local-ipc = { path = "../local-ipc" }
orchbee-local-peer-credentials = { path = "../local-peer-credentials" }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
