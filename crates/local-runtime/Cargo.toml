[package]
name = "orchbee-local-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "user"] }

[dependencies]
toml.workspace = true
toml_edit.workspace = true
orchbee-color-themes = { path = "../color-themes" }
orchbee-connection-handshake = { path = "../connection-handshake" }
orchbee-local-ipc = { path = "../local-ipc" }
orchbee-workbench-protocol = { path = "../workbench-protocol" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[build-dependencies]
sha2.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
exacl = { version = "0.13.0", default-features = false }
nix = { workspace = true, features = ["mount"] }

[target.'cfg(windows)'.dependencies]
process-wrap.workspace = true
windows.workspace = true
winsafe = { workspace = true, features = ["advapi"] }
winapi-util.workspace = true
windows-permissions = { version = "0.2.4", default-features = false }
