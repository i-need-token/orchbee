SPECIFICATION Spec

CONSTANTS
  Versions = {0, 1, 2, 3}
  Floor <- FloorOfVersion
  Gens = {1}
  Writers = {w1, w2}
  Nobody = nobody
  Threshold = 2
  Window = 1
  LockedUpdate = TRUE
  BindRecord = TRUE
  HoldInSameWrite = TRUE
  SkipHeld = TRUE
  AttributeStarts = TRUE
  ProofRequired = TRUE
  FloorChecked = TRUE

\* The gate's variants set these two; the mutation suite runs the fixed clock written here.
CONSTANT MaxTime = 0
CONSTANT MaxMoves = 2

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  NoLostRecord
  Attribution
  RecordBound
  NoReturn
  TargetProven
  FallbackAboveFloor
  HeldNeverActive
  BackImpliesPreviousOnDisk
  FallbackWithinWindow
  AtMostOncePerMove

PROPERTIES
  MoveNeverReverted
  EveryOpEnds
