[package]
name = "orchbee-local-site-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "user"] }

[dependencies]
orchbee-local-ipc = { path = "../local-ipc" }
orchbee-workbench-protocol = { path = "../workbench-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
exacl = { version = "=0.13.0", default-features = false }

[target.'cfg(windows)'.dependencies]
process-wrap.workspace = true
windows.workspace = true
toml = { version = "=1.1.6", default-features = false, features = ["std", "parse", "serde"] }
# Syntax-preserving release-channel edits in the shared settings owner.
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse", "display"] }
winsafe = { workspace = true, features = ["advapi"] }
winapi-util.workspace = true
windows-permissions = { version = "=0.2.4", default-features = false }
