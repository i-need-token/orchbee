# Flexoki by Steph Ango (https://github.com/kepano/flexoki, MIT), as the iTerm2-Color-Schemes Ghostty
# export publishes it.
id = "flexoki-light"
name = "Flexoki Light"
family = "flexoki"
polarity = "light"

[source]
