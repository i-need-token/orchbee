# Orchbee's light default. The canvas, cursor, and selection are Orchbee's own values; the source
# supplies ANSI 0-15, the light column of the VS Code terminal color registry.
id = "orchbee-light"
name = "Orchbee Light"
family = "orchbee"
polarity = "light"

[source]
url = "https://github.com/microsoft/vscode"
path = "src/vs/workbench/contrib/terminal/common/terminalColorRegistry.ts"
revision = "c647c1cfa2c2a4b1bbf12cb4db413fe05a0d9044"
license = "MIT"
copyright = "Copyright (c) 2015 - present Microsoft Corporation"

[canvas]
background = "#fcfcfc"
foreground = "#141414"
# The previous cursor reached 2.02:1 on the background; darkened to 3:1.
cursor = { value = "#2e9cd4", original = "#57bef8" }
cursor_text = "#fcfcfc"
selection_background = "#c6dafb"
selection_foreground = "#141414"

[ansi]
black = "#000000"
red = "#cd3131"
green = "#107c10"
yellow = "#949800"
blue = "#0451a5"
magenta = "#bc05bc"
cyan = "#0598bc"
white = "#555555"
bright_black = "#666666"
bright_red = "#cd3131"
bright_green = "#14ce14"
bright_yellow = "#b5ba00"
bright_blue = "#0451a5"
bright_magenta = "#bc05bc"
bright_cyan = "#0598bc"
bright_white = "#a5a5a5"
