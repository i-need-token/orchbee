# Gruvbox by Pavel Pertsev (https://github.com/morhetz/gruvbox, MIT), as the iTerm2-Color-Schemes
# Ghostty export publishes it.
id = "gruvbox-dark"
name = "Gruvbox Dark"
family = "gruvbox"
polarity = "dark"

[source]
url = "https://github.com/mbadolato/iTerm2-Color-Schemes"
path = "ghostty/Gruvbox Dark"
revision = "38bd77ce06b376f2e49e78bd318cf1255d87719b"
license = "MIT"
copyright = "Copyright (c) Pavel Pertsev; iTerm2-Color-Schemes compilation Copyright (c) 2011 to Present Mark Badolato"

[canvas]
background = "#282828"
foreground = "#ebdbb2"
cursor = "#ebdbb2"
cursor_text = "#282828"
selection_background = "#665c54"
selection_foreground = "#ebdbb2"

[ansi]
black = "#282828"
# Lightened from 2.69:1 to 3:1 on the background.
red = { value = "#d53026", original = "#cc241d" }
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"
bright_black = "#928374"
bright_red = "#fb4934"
bright_green = "#b8bb26"
bright_yellow = "#fabd2f"
bright_blue = "#83a598"
bright_magenta = "#d3869b"
bright_cyan = "#8ec07c"
bright_white = "#ebdbb2"
