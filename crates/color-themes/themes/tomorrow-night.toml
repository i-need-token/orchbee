# Tomorrow Night by Chris Kempson (https://github.com/chriskempson/tomorrow-theme, MIT), as the
# iTerm2-Color-Schemes Ghostty export publishes it.
id = "tomorrow-night"
name = "Tomorrow Night"
family = "tomorrow"
polarity = "dark"

[source]
url = "https://github.com/mbadolato/iTerm2-Color-Schemes"
path = "ghostty/Tomorrow Night"
revision = "38bd77ce06b376f2e49e78bd318cf1255d87719b"
license = "MIT"
copyright = "Copyright (C) 2011 Chris Kempson; iTerm2-Color-Schemes compilation Copyright (c) 2011 to Present Mark Badolato"

[canvas]
background = "#1d1f21"
foreground = "#c5c8c6"
cursor = "#c5c8c6"
cursor_text = "#1d1f21"
selection_background = "#373b41"
selection_foreground = "#c5c8c6"

[ansi]
black = "#000000"
red = "#cc6666"
green = "#b5bd68"
yellow = "#f0c674"
blue = "#81a2be"
magenta = "#b294bb"
cyan = "#8abeb7"
white = "#ffffff"
# Lightened from 1.93:1 to 2:1 on the background.
bright_black = { value = "#4f4f4f", original = "#4c4c4c" }
bright_red = "#cc6666"
bright_green = "#b5bd68"
bright_yellow = "#f0c674"
bright_blue = "#81a2be"
bright_magenta = "#b294bb"
bright_cyan = "#8abeb7"
bright_white = "#ffffff"
