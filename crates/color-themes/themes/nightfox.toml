# Nightfox by James Simpson (https://github.com/EdenEast/nightfox.nvim, MIT), as the
# iTerm2-Color-Schemes Ghostty export publishes it.
id = "nightfox"
name = "Nightfox"
family = "nightfox"
polarity = "dark"

[source]
url = "https://github.com/mbadolato/iTerm2-Color-Schemes"
path = "ghostty/Nightfox"
revision = "38bd77ce06b376f2e49e78bd318cf1255d87719b"
license = "MIT"
copyright = "Copyright (c) 2021 James Simpson; iTerm2-Color-Schemes compilation Copyright (c) 2011 to Present Mark Badolato"

[canvas]
background = "#192330"
foreground = "#cdcecf"
cursor = "#cdcecf"
cursor_text = "#192330"
selection_background = "#2b3b51"
selection_foreground = "#cdcecf"

[ansi]
black = "#393b44"
red = "#c94f6d"
green = "#81b29a"
yellow = "#dbc074"
blue = "#719cd6"
magenta = "#9d79d6"
cyan = "#63cdcf"
white = "#dfdfe0"
bright_black = "#575860"
bright_red = "#d16983"
bright_green = "#8ebaa4"
bright_yellow = "#e0c989"
bright_blue = "#86abdc"
bright_magenta = "#baa1e2"
bright_cyan = "#7ad5d6"
bright_white = "#e4e4e5"
