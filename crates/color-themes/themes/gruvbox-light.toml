# Gruvbox by Pavel Pertsev (https://github.com/morhetz/gruvbox, MIT), as the iTerm2-Color-Schemes
# Ghostty export publishes it.
id = "gruvbox-light"
name = "Gruvbox Light"
family = "gruvbox"
polarity = "light"

[source]
url = "https://github.com/mbadolato/iTerm2-Color-Schemes"
path = "ghostty/Gruvbox Light"
revision = "38bd77ce06b376f2e49e78bd318cf1255d87719b"
license = "MIT"
copyright = "Copyright (c) Pavel Pertsev; iTerm2-Color-Schemes compilation Copyright (c) 2011 to Present Mark Badolato"

[canvas]
background = "#fbf1c7"
foreground = "#3c3836"
cursor = "#3c3836"
cursor_text = "#fbf1c7"
selection_background = "#3c3836"
selection_foreground = "#fbf1c7"

[ansi]
black = "#fbf1c7"
red = "#cc241d"
# Darkened from 2.73:1 to 3:1 on the background.
green = { value = "#918f08", original = "#98971a" }
# Darkened from 2.19:1 to 3:1 on the background.
yellow = { value = "#b98000", original = "#d79921" }
blue = "#458588"
magenta = "#b16286"
# Darkened from 2.80:1 to 3:1 on the background.
cyan = { value = "#639765", original = "#689d6a" }
white = "#7c6f64"
bright_black = "#928374"
bright_red = "#9d0006"
bright_green = "#79740e"
bright_yellow = "#b57614"
bright_blue = "#076678"
bright_magenta = "#8f3f71"
bright_cyan = "#427b58"
bright_white = "#3c3836"
