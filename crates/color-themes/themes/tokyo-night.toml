# Tokyo Night, the Night style, from the Ghostty extra of folke/tokyonight.nvim (Apache-2.0). The
# source publishes no cursor text color; it is the canvas background.
id = "tokyo-night"
name = "Tokyo Night"
family = "tokyo-night"
polarity = "dark"

[source]
url = "https://github.com/folke/tokyonight.nvim"
path = "extras/ghostty/tokyonight_night"
revision = "cdc07ac78467a233fd62c493de29a17e0cf2b2b6"
license = "Apache-2.0"
copyright = "Copyright (c) Folke Lemaitre"

[canvas]
background = "#1a1b26"
foreground = "#c0caf5"
cursor = "#c0caf5"
cursor_text = "#1a1b26"
selection_background = "#283457"
selection_foreground = "#c0caf5"

[ansi]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"
# Lightened from 1.91:1 to 2:1 on the background.
bright_black = { value = "#434b6b", original = "#414868" }
bright_red = "#ff899d"
bright_green = "#9fe044"
bright_yellow = "#faba4a"
bright_blue = "#8db0ff"
bright_magenta = "#c7a9ff"
bright_cyan = "#a4daff"
bright_white = "#c0caf5"
