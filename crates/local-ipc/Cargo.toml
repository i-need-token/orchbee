[package]
name = "orchbee-local-ipc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
interprocess = { version = "=2.4.4", default-features = false }
winsafe = { workspace = true, features = ["advapi"] }
widestring = "=1.2.1"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["poll"] }
