SPECIFICATION Spec

CONSTANTS
  Terminals = {terminal1, terminal2}

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  AbsentTerminalHasNoRequests
  ForceRequiresGracefulRequest

PROPERTIES
